name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
env:
  # Everything runs on Malaysian time (UTC+8): a date taken in UTC is yesterday before 8 am.
  TZ: Asia/Kuala_Lumpur
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run validate:curriculum
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: app/dist, retention-days: 3 }

  # Every browser suite, the accessibility audit and the speed budget, on Chromium.
  chromium:
    needs: build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: app/dist }
      - run: npx playwright install --with-deps chromium
      - name: Start the production build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
      - run: npm run smoke
      - run: npm run e2e
      - run: npm run e2e:teach
      - run: npm run e2e:m5   # skipped: the KPM textbook PDFs are not in the repository
      - run: npm run e2e:m6
      - run: npm run e2e:m7
      - run: npm run e2e:m8
      - run: npm run e2e:m9
      - run: npm run e2e:m10
      - run: npm run e2e:quality
      - run: npm run e2e:studio
      - run: npm run a11y
      - run: npm run perf

  # Safari's engine (every iPhone and iPad) and Firefox: core journeys and the quality checks.
  other-browsers:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { browser: [webkit, firefox] }
    env: { BROWSER: '${{ matrix.browser }}' }
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: app/dist }
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start the production build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
      - run: npm run smoke
      - run: npm run e2e
      - run: npm run e2e:quality
      - run: npm run e2e:studio
