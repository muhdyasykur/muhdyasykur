<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi 2: Saya Yakin, Saya Boleh!</title>
<meta name="description" content="BBM digital berpusatkan bahan untuk Pendidikan Kesihatan Tahun 3, SK 3.1 Keyakinan Diri.">
<style>
@font-face{font-family:Fredoka;font-weight:500;font-display:swap;src:url(data:font/woff2;base64,__FONT500__) format('woff2')}
@font-face{font-family:Fredoka;font-weight:700;font-display:swap;src:url(data:font/woff2;base64,__FONT700__) format('woff2')}
:root{
  --bg:#172b78;--bg2:#243c9a;--deep:#0f1d57;--pk:#ff70b7;--yl:#ffe34d;--gr:#5ee8a8;--cy:#63e3ff;--or:#ff9c45;--rd:#ff5d6c;
  --ink:#172b78;--paper:#fffdf4;--shadow:#0b1650;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:Fredoka,'Baloo 2','Comic Sans MS',system-ui,sans-serif;font-weight:500;color:#fff;
  font-size:clamp(17px,1.55vw,26px);
  background:radial-gradient(circle at 12% 18%,#4269dc 0,transparent 30%),radial-gradient(circle at 88% 30%,#673fb3 0,transparent 28%),linear-gradient(145deg,#172b78 0%,#243c9a 50%,#18296f 100%);
  background-attachment:fixed;overflow-x:hidden;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.16;background-image:radial-gradient(#fff 1.4px,transparent 1.4px);background-size:34px 34px}
button{font:inherit;color:inherit}
.hide{display:none!important}

/* ---------- Bar atas ---------- */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(90deg,#122166,#2a40a0,#122166);box-shadow:0 5px 18px #07164f88;flex-wrap:wrap}
#top .brand{font-weight:700;font-size:clamp(14px,1.2vw,20px);display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
#top .brand b{background:var(--yl);color:var(--ink);border-radius:12px;padding:2px 9px}
#path{display:flex;gap:4px;flex:1;justify-content:center;min-width:280px}
#path .pp{display:flex;flex-direction:column;align-items:center;font-size:clamp(10px,.8vw,13px);font-weight:700;opacity:.65;min-width:52px;cursor:pointer;background:none;border:0;padding:0}
#path .pp i{font-style:normal;display:grid;place-items:center;width:clamp(28px,2.4vw,38px);height:clamp(28px,2.4vw,38px);border-radius:50%;border:3px solid #fff8;background:#ffffff18;font-size:clamp(14px,1.2vw,20px);margin-bottom:2px}
#path .pp.done{opacity:1}#path .pp.done i{background:var(--gr);border-color:#fff}
#path .pp.now{opacity:1}#path .pp.now i{background:var(--yl);border-color:#fff;animation:bnc 1.2s infinite}
#path .ln{flex:0 0 14px;height:3px;background:#fff4;align-self:center;margin-top:-14px;border-radius:3px}
#keys{display:flex;gap:4px;align-items:center;background:#0b1650aa;border:2px solid #fff6;border-radius:16px;padding:4px 8px}
#keys .k{width:26px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:15px;background:#ffffff14;border:2px dashed #fff6}
#keys .k.on{background:var(--yl);border:2px solid #fff;animation:pop .6s}
#timer{font-weight:700;background:#fff;color:var(--ink);border:0;border-radius:16px;padding:4px 12px;min-width:92px;cursor:pointer;box-shadow:0 4px 0 var(--shadow);font-size:clamp(14px,1.2vw,20px)}
#timer.run{background:var(--gr)}#timer.late{background:var(--rd);color:#fff;animation:bnc 1s infinite}
.tb{border:0;background:#ffffff22;border-radius:12px;padding:5px 9px;cursor:pointer;font-size:clamp(14px,1.1vw,19px)}
.tb:hover{background:#ffffff40}

/* ---------- Asas ---------- */
main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:14px 18px 110px}
.screen{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;background:var(--pk);color:#fff;border:3px solid #fff;border-radius:999px;padding:3px 14px;font-weight:700;font-size:.72em;letter-spacing:.04em;box-shadow:0 4px 0 var(--shadow)}
.tag.y{background:var(--yl);color:var(--ink)}.tag.g{background:var(--gr);color:var(--ink)}.tag.c{background:var(--cy);color:var(--ink)}
h1{font-size:clamp(34px,4.8vw,78px);margin:.12em 0;color:var(--yl);text-shadow:0 5px 0 #0008;line-height:1.05}
h2{font-size:clamp(26px,3vw,50px);margin:.25em 0;line-height:1.1;text-shadow:0 3px 0 #0006}
h3{font-size:clamp(20px,1.9vw,32px);margin:.3em 0}
p{margin:.4em 0}
.c{text-align:center}
.card{position:relative;background:linear-gradient(145deg,#3154c2,#203d9c 58%,#182d7a);border:5px solid #fff;border-radius:32px;padding:clamp(14px,1.6vw,26px);margin:12px 0;box-shadow:0 10px 0 var(--shadow),0 18px 30px #06134455}
.paper{background:var(--paper);color:var(--ink);border:5px solid #fff;border-radius:28px;padding:clamp(14px,1.6vw,26px);box-shadow:0 10px 0 var(--shadow)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.row.cen{justify-content:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;gap:.4em;font-weight:700;font-size:clamp(17px,1.5vw,26px);border:4px solid #fff;border-radius:24px;padding:.45em 1em;cursor:pointer;color:var(--ink);background:var(--yl);box-shadow:0 7px 0 var(--shadow),0 10px 18px #07134455;transition:transform .18s,filter .18s}
.btn:hover,.btn:focus-visible{transform:translateY(-4px) rotate(-1deg) scale(1.03);filter:brightness(1.07);outline:none}
.btn:active{transform:translateY(3px) scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pk{background:var(--pk);color:#fff}.btn.gr{background:var(--gr)}.btn.cy{background:var(--cy)}.btn.wh{background:#fff}.btn.or{background:var(--or)}
.btn.sm{font-size:clamp(14px,1.05vw,18px);padding:.32em .8em;border-width:3px;box-shadow:0 4px 0 var(--shadow)}
.btn.big{font-size:clamp(22px,2.2vw,38px);padding:.5em 1.3em}
.pulse{animation:pulse 1.6s infinite}

/* ---------- Navigasi bawah ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:linear-gradient(0deg,#0e1b55,#0e1b55cc 70%,transparent)}
#nav .dots{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
#nav .dots i{width:13px;height:13px;border-radius:50%;background:#fff5;display:block}
#nav .dots i.on{background:var(--yl);transform:scale(1.35)}
#nav .lbl{font-size:clamp(12px,.9vw,15px);opacity:.85;font-weight:700;text-align:center}

/* ---------- Pilihan A/B/C (selari dengan Kad Respons fizikal) ---------- */
.opts{display:grid;gap:14px;margin-top:12px}
.opt{display:flex;align-items:center;gap:.6em;text-align:left;font-weight:700;font-size:clamp(20px,2vw,34px);padding:.55em .9em;min-height:72px;border:5px solid #fff;border-radius:24px;color:var(--ink);cursor:pointer;box-shadow:0 7px 0 var(--shadow);transition:transform .2s,opacity .3s,filter .3s}
.opt b{flex:0 0 auto;display:grid;place-items:center;width:1.7em;height:1.7em;background:#fff;border-radius:50%;font-size:1.05em}
.opt.A{background:var(--pk)}.opt.B{background:var(--yl)}.opt.C{background:var(--gr)}
.opt:hover{transform:translateX(6px)}
.opt.dim{opacity:.35;filter:grayscale(.6)}
.opt.win{outline:8px solid #fff;outline-offset:3px;animation:pop .6s}
.opt.win::after{content:"✔";margin-left:auto;font-size:1.3em}
.fb{margin-top:14px;padding:12px 16px;border-radius:20px;border:4px solid #fff;font-weight:700;font-size:1.1em;background:var(--gr);color:var(--ink);animation:msg .45s}
.fb.y{background:var(--yl)}

/* ---------- Kad Tugasan (Gaya B: Latihan) ---------- */
.task{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.env{position:relative;width:clamp(120px,13vw,200px);aspect-ratio:1.45;background:linear-gradient(160deg,#ffe9a8,#ffd25c);border:4px solid #fff;border-radius:14px;box-shadow:0 8px 0 var(--shadow);display:grid;place-items:center;font-size:clamp(34px,4vw,64px);color:var(--ink);font-weight:700}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,transparent 49%,#e8b73f 50%) top/100% 55% no-repeat,linear-gradient(-155deg,transparent 49%,#e8b73f 50%) top/100% 55% no-repeat;border-radius:10px}
.env.tab{background:linear-gradient(160deg,#2b3b7a,#11194a);border-radius:22px;border:6px solid #e8ecff}
.env.tab::before{display:none}
.env span{position:relative;z-index:1;background:#fff;border-radius:50%;width:1.5em;height:1.5em;display:grid;place-items:center;font-size:.7em;border:3px solid var(--ink)}
.env em{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:var(--pk);color:#fff;font-style:normal;font-size:clamp(12px,1vw,16px);padding:2px 10px;border-radius:12px;border:2px solid #fff;white-space:nowrap}
.steps{margin:.3em 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:.6em;align-items:flex-start;margin:.45em 0;font-size:1.05em}
.steps li::before{content:counter(s);flex:0 0 1.6em;height:1.6em;border-radius:50%;background:var(--yl);color:var(--ink);display:grid;place-items:center;font-weight:700;border:3px solid #fff}
.paper .steps li::before{border-color:var(--ink)}

/* ---------- Pemasa aktiviti ---------- */
.ring{position:relative;width:clamp(120px,11vw,170px);aspect-ratio:1;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:clamp(26px,2.4vw,40px)}
.ring.end .t{color:var(--rd);animation:bnc .8s infinite}

/* ---------- Mei ---------- */
.mei{width:clamp(150px,15vw,250px);display:block;margin:0 auto}
.mei *{transition:all .7s cubic-bezier(.3,1.4,.5,1)}
.meter{position:relative;height:30px;border-radius:20px;background:#0b1650;border:4px solid #fff;overflow:hidden}
.meter u{position:absolute;left:0;top:0;bottom:0;width:10%;background:linear-gradient(90deg,var(--rd),var(--or),var(--yl),var(--gr));transition:width 1.2s cubic-bezier(.3,1.3,.5,1)}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;text-shadow:0 2px 2px #000a}
.bubble{position:relative;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:24px;padding:12px 16px;font-weight:700;font-size:1.05em;box-shadow:0 6px 0 #0b165066}
.bubble::after{content:"";position:absolute;left:-16px;top:34px;width:22px;height:22px;background:#fff;border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg)}
.scene{position:relative;border:5px solid #fff;border-radius:30px;background:linear-gradient(#9fe8ff,#eafcff 70%,#ffe2a8 70%,#f5c978);overflow:hidden;padding:14px;box-shadow:0 10px 0 var(--shadow)}
.scene .board{position:absolute;left:4%;top:8%;width:28%;aspect-ratio:1.6;background:#1f6b46;border:8px solid #a86b33;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:clamp(14px,1.3vw,22px);font-family:'Comic Sans MS',Fredoka,cursive}

/* ---------- Peti ---------- */
.chest{width:clamp(200px,22vw,340px);display:block;margin:0 auto;overflow:visible}
.chest .lid{transform-origin:50% 92%;transform-box:fill-box;transition:transform 1.1s cubic-bezier(.3,1.6,.5,1)}
.chest.open .lid{transform:rotate(-24deg) translate(-6px,-34px)}
.chest .rays{opacity:0;transform-origin:center;transform-box:fill-box;transition:opacity .8s}
.chest.open .rays{opacity:1;animation:spin 9s linear infinite}
.chest .lock{transition:transform .8s,opacity .8s}
.chest.open .lock{transform:translateY(80px) rotate(40deg);opacity:0}
.chest.shake{animation:shk .45s}
.slots{display:flex;gap:12px;justify-content:center;margin:12px 0}
.slots div{width:clamp(56px,5vw,84px);height:clamp(70px,6.2vw,104px);border-radius:16px;border:4px solid #fff;background:#0b1650;display:grid;place-items:center;font-size:clamp(36px,3.6vw,60px);font-weight:700;color:var(--yl);box-shadow:inset 0 -6px 0 #0006}
.slots div.on{background:#fff;color:var(--ink);animation:pop .3s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.pad button{font-size:clamp(24px,2.2vw,36px);font-weight:700;border:4px solid #fff;border-radius:18px;padding:.25em;background:var(--cy);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--shadow)}
.pad button:active{transform:translateY(3px)}
.pad .x{background:var(--pk);color:#fff}.pad .ok{background:var(--gr)}

/* ---------- Padanan & Sisih ---------- */
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px 34px}
.mt{border:5px solid #fff;border-radius:22px;padding:12px 14px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:84px;box-shadow:0 6px 0 var(--shadow);transition:transform .2s,background .3s;user-select:none;font-size:1.05em}
.mt .em{font-size:clamp(34px,3.2vw,54px)}
.mt:hover{transform:translateY(-3px)}
.mt.sel{outline:7px dashed var(--yl);outline-offset:3px;transform:scale(1.03)}
.mt.done{cursor:default;transform:none}
.mt.bad{animation:shk .4s}
.mt.k0{background:#ffd3e9}.mt.k1{background:#fff3b0}.mt.k2{background:#c9f8e1}.mt.k3{background:#cdf4ff}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:90px;padding:10px;border:4px dashed #fff8;border-radius:24px;margin-bottom:14px}
.bc{background:#fff;color:var(--ink);border:4px solid #fff;border-radius:18px;padding:8px 12px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:grab;box-shadow:0 5px 0 var(--shadow);user-select:none;max-width:290px;font-size:.95em;transition:transform .2s}
.bc .em{font-size:1.7em}
.bc.sel{outline:6px dashed var(--yl);outline-offset:2px;transform:scale(1.04) rotate(-1deg)}
.bc.bad{animation:shk .4s}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bin{border:5px solid #fff;border-radius:28px;padding:12px;min-height:220px;cursor:pointer;transition:transform .2s}
.bin h3{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.bin .lamp{width:46px;height:46px;border-radius:50%;border:4px solid #fff;flex:0 0 auto}
.bin.gn{background:linear-gradient(160deg,#1f9e66,#137a4d)}.bin.gn .lamp{background:#3dff9e;box-shadow:0 0 22px #3dff9e}
.bin.rd{background:linear-gradient(160deg,#c23a4f,#94283a)}.bin.rd .lamp{background:#ff5d6c;box-shadow:0 0 22px #ff5d6c}
.bin.hot{transform:scale(1.02);outline:6px dashed var(--yl)}
.bin .bc{cursor:default;margin:6px 0;max-width:none}

/* ---------- Roda ---------- */
.wheelbox{position:relative;width:clamp(260px,29vw,430px);aspect-ratio:1;margin:0 auto}
.wheelbox svg.w{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.75,.15,1);filter:drop-shadow(0 10px 0 var(--shadow))}
.wheelbox .ptr{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:clamp(40px,4vw,62px);z-index:2;filter:drop-shadow(0 4px 0 var(--shadow))}
.wheelbox .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;background:#fff;border:6px solid var(--ink);display:grid;place-items:center;font-size:clamp(26px,2.6vw,44px);cursor:pointer;z-index:2;box-shadow:0 6px 0 var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:3px solid #fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85em;cursor:pointer;box-shadow:0 4px 0 var(--shadow)}
.chip.done{background:var(--gr)}
.chip.on{background:var(--yl)}
.part{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.part button{border:4px solid #fff;border-radius:18px;padding:6px 14px;font-weight:700;background:#ffffff22;cursor:pointer}
.part button.on{background:var(--yl);color:var(--ink)}
.part button.ok{background:var(--gr);color:var(--ink)}
.gaya{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gy{border:4px solid #fff;border-radius:20px;padding:10px 6px;text-align:center;background:#ffffff1a;cursor:pointer;font-weight:700;font-size:.9em;transition:all .25s}
.gy .em{font-size:clamp(34px,3.2vw,56px);display:block}
.gy.on{background:var(--gr);color:var(--ink);transform:translateY(-4px)}
@media(max-width:700px){.gaya{grid-template-columns:1fr 1fr}}

/* ---------- Meter Suara ---------- */
.vm{display:flex;gap:16px;align-items:stretch}
.vbar{position:relative;flex:1;height:64px;border:5px solid #fff;border-radius:22px;background:linear-gradient(90deg,#ffffff14 0 35%,#5ee8a833 35% 75%,#ffe34d44 75%);overflow:hidden}
.vbar u{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--cy),var(--gr),var(--yl));transition:width .08s}
.vbar .zl{position:absolute;top:0;bottom:0;border-left:3px dashed #fff;opacity:.8}
.vbar .lb{position:absolute;bottom:2px;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000}
.vstar{flex:0 0 auto;width:100px;display:grid;place-items:center;border:5px solid #fff;border-radius:22px;background:#0b1650;font-size:13px;font-weight:700;text-align:center;position:relative;overflow:hidden}
.vstar u{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--yl);transition:height .15s}
.vstar span{position:relative;font-size:38px;line-height:1}
.vstar small{position:relative}
.vstar.full{animation:pop .6s;background:var(--gr)}

/* ---------- Cermin Ajaib ---------- */
.mirror{position:relative;width:clamp(260px,34vw,520px);aspect-ratio:4/3.3;margin:0 auto;border-radius:48% 48% 26px 26px/40% 40% 26px 26px;padding:22px;background:conic-gradient(from 0deg,#ffd84d,#fff3b0,#e8a91c,#ffe680,#d99511,#ffd84d);box-shadow:0 10px 0 var(--shadow),0 0 40px #ffe34d88}
.mirror .glass{position:relative;width:100%;height:100%;border-radius:46% 46% 16px 16px/38% 38% 16px 16px;overflow:hidden;background:radial-gradient(circle at 35% 30%,#ffffff,#bfe9ff 40%,#7fb2ff);display:grid;place-items:center}
.mirror video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.mirror .crown{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:clamp(44px,4.4vw,70px);z-index:3;animation:flt 2.6s ease-in-out infinite}
.mirror .ban{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);background:var(--pk);color:#fff;border:4px solid #fff;border-radius:16px;padding:4px 18px;font-weight:700;white-space:nowrap;z-index:3;font-size:clamp(16px,1.6vw,26px)}
.mirror .sp{position:absolute;font-size:28px;z-index:3;animation:twinkle 1.8s infinite}

/* ---------- Dinding ---------- */
.wall{position:relative;min-height:300px;border:6px solid #c98a4a;border-radius:20px;background:#d9a066 repeating-linear-gradient(45deg,#d39a5f 0 6px,#dba56c 6px 12px);padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start}
.note{width:clamp(130px,12vw,190px);aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:26px 22px 18px;color:var(--ink);font-weight:700;font-size:clamp(13px,1.05vw,17px);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:stick .5s cubic-bezier(.3,1.6,.5,1) both;line-height:1.15}
.note span{display:block;padding-top:20%}
.wall .empty{color:#6b4120;font-weight:700;margin:auto;opacity:.75}

/* ---------- Tindanan ---------- */
#ov{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:#050c33d9;padding:20px}
#ov.on{display:grid}
.cd{font-size:min(36vw,60vh);font-weight:700;color:var(--yl);text-shadow:0 12px 0 var(--pk);animation:cdz .9s both}
.cd.w{font-size:min(12vw,20vh);text-align:center}
.modal{background:var(--paper);color:var(--ink);border:6px solid #fff;border-radius:30px;padding:22px;max-width:1100px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 0 var(--shadow);animation:pop .4s}
.modal h2{text-shadow:none;color:var(--ink)}
.dg{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}

/* ---------------- Pemasa ---------------- */
let TM={left:0,run:false,id:null,ph:-1};
function setPhaseTimer(p){const m=phMin(p)||0;if(TM.ph===p)return;TM.ph=p;TM.left=m*60;TM.run=m>0;drawTimer()}
function drawTimer(){const t=$('#timer'),l=Math.abs(TM.left),s=(TM.left<0?'-':'')+Math.floor(l/60)+':'+String(l%60).padStart(2,'0');t.textContent='⏱ '+s;t.classList.toggle('run',TM.run&&TM.left>=0);t.classList.toggle('late',TM.left<0)}
setInterval(()=>{if(TM.run){TM.left--;if(TM.left===0)SFX.beep();drawTimer()}},1000);
$('#timer').onclick=()=>{TM.run=!TM.run;drawTimer()};
/* pemasa cincin dalam aktiviti */
let RT=null;
function ring(sec,id='rg'){return `<div class="ring" id="${id}" data-sec="${sec}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="#ffffff30" stroke-width="10" fill="none"/><circle class="rp" cx="50" cy="50" r="44" stroke="#ffe34d" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="t">${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</div></div>`}
function startRing(id='rg'){const r=document.getElementById(id);if(!r)return;clearInterval(RT);const tot=+r.dataset.sec;let l=tot;r.classList.remove('end');SFX.go();
 const up=()=>{const t=r.querySelector('.t'),c=r.querySelector('.rp');if(!t)return clearInterval(RT);t.textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0');c.style.strokeDashoffset=276.5*(1-l/tot);c.style.stroke=l<=10?'#ff5d6c':'#ffe34d'};
 up();RT=setInterval(()=>{l--;if(l<=5&&l>0)SFX.tick();if(l<=0){clearInterval(RT);l=0;up();r.classList.add('end');SFX.fan()}else up()},1000)}

const ov=$('#ov');
function overlay(h,close=true){ov.innerHTML=h;ov.classList.add('on');if(close)ov.onclick=e=>{if(e.target===ov||e.target.closest('[data-close]'))hideOv()};else ov.onclick=null;bindSay(ov)}
function hideOv(){ov.classList.remove('on');ov.innerHTML=''}
function countdown(done){let n=3;ov.onclick=null;ov.classList.add('on');const show=()=>{if(n>0){ov.innerHTML=`<div class="cd">${n}</div>`;SFX.beep();n--;setTimeout(show,850)}else{ov.innerHTML='<div class="cd w">ANGKAT<br>KAD! 🅰️🅱️©️</div>';SFX.go();setTimeout(()=>{hideOv();done&&done()},1100)}};show()}
function giveKey(i,next){
 if(!ST.keys[i]){ST.keys[i]=1;save()}
 const d=ST.cfg.code[i]||'?';SFX.key();confetti(40);
 overlay(`<div class="dg"><span class="tag y">🔑 KOD KE-${i+1} DIJUMPAI!</span><div class="dgcard">${esc(d)}</div>
 <h2>Kod ke-${i+1} ialah ${esc(d)}</h2><p class="small">Kod yang sama muncul pada tablet kumpulan yang telah berjaya menyelesaikan misi. Semak bersama!</p>
 <button class="btn gr big" data-close>Simpan Kunci ✔</button></div>`);
 ov.onclick=e=>{if(e.target.closest('[data-close]')){hideOv();drawTop();next&&next()}}
}

 $('#keys').innerHTML='🔑'+ST.keys.map(k=>`<span class="k ${k?'on':''}">${k?'✔':''}</span>`).join('');
 $('#bSnd').textContent=ST.cfg.snd?'🔊':'🔇';
 $$('#path [data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go,0));

let CLEAN=[];/* fungsi pembersihan (mikrofon/kamera) */
function cleanup(){CLEAN.forEach(f=>{try{f()}catch(e){}});CLEAN=[];clearInterval(RT);if('speechSynthesis' in window)speechSynthesis.cancel()}

function go(p,s=0){
 cleanup();ST.p=p;ST.s=s;save();
 if(document.body.classList.contains('gm')){document.body.classList.remove('gm');$('#brand').innerHTML='<b>Misi 2</b><span>Saya Yakin, Saya Boleh!</span>'}
 const app=$('#app');
 if(p<0){$('#nav').classList.add('hide');app.innerHTML=SCR[ST.view||'home']();(SCR_ON[ST.view||'home']||(()=>{}))();drawTop();bindSay(app);window.scrollTo(0,0);return}
 setPhaseTimer(p);
 const ph=PH[p],r=ph.steps[s]();
 app.innerHTML=`<div class="screen"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="tag c">${ph.ic} ${ph.ln}</span><span class="small">Cadangan masa: ${phMin(p)?phMin(p)+' minit':'—'}</span></div>${r.h}</div>`;
 $('#nav').classList.remove('hide');
 $('#dots').innerHTML=ph.steps.map((_,i)=>`<i class="${i===s?'on':''}"></i>`).join('');
 $('#navlbl').textContent=`${ph.nm} · ${s+1}/${ph.steps.length}`;
 $('#bBack').disabled=false;
 const last=p===PH.length-1&&s===ph.steps.length-1;
 $('#bNext').classList.toggle('hide',last);
 drawTop();bindSay(app);r.on&&r.on();window.scrollTo(0,0);
}
function next(){const ph=PH[ST.p];if(ST.p<0)return;if(ST.s<ph.steps.length-1)return go(ST.p,ST.s+1);
 if(ph.key!==undefined&&!ST.keys[ph.key])return giveKey(ph.key,()=>go(ST.p+1,0));
 if(ST.p<PH.length-1)go(ST.p+1,0)}
function back(){if(ST.p<0)return;if(ST.s>0)go(ST.p,ST.s-1);else if(ST.p>0)go(ST.p-1,PH[ST.p-1].steps.length-1);else home()}
$('#bNext').onclick=next;$('#bBack').onclick=back;
function home(v='home'){ST.view=v;go(-1)}
$('#brand').onclick=()=>home();
function bindSay(root){root.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.dataset.say)})}

function vmeter(id){return `<div class="vm" id="${id}"><div class="vbar"><u></u><span class="zl" style="left:35%"></span><span class="zl" style="left:75%"></span>

function bindVm(id,onFull){const box=$('#'+id);if(!box)return;const bar=box.querySelector('.vbar u'),st=box.querySelector('.vstar'),stu=st.querySelector('u'),sts=st.querySelector('small'),lab=box.parentElement.querySelector('[data-st]');
 let fill=0,raf=null,stream=null,an=null;
 const add=v=>{if(fill>=100)return;fill=Math.min(100,fill+v);stu.style.height=fill+'%';sts.textContent=Math.round(fill)+'%';if(fill>=100){st.classList.add('full');st.querySelector('span').textContent='🌟';SFX.fan();confetti(40);onFull&&onFull()}};
 box.parentElement.querySelector('[data-man]').onclick=()=>{add(34);SFX.pop()};
 const micB=box.parentElement.querySelector('[data-mic]');
 const start=async()=>{if(!ST.cfg.mic){lab.textContent='Mikrofon dimatikan dalam Persediaan.';return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const a=ac();const src=a.createMediaStreamSource(stream);an=a.createAnalyser();an.fftSize=1024;src.connect(an);
   const d=new Float32Array(an.fftSize);micB.textContent='🎙️ Mikrofon aktif';micB.disabled=true;lab.textContent='Bercakap sekarang!';
   const sens=(ST.cfg.sens||5)/5;
   const loop=()=>{an.getFloatTimeDomainData(d);let s=0;for(const x of d)s+=x*x;const rms=Math.sqrt(s/d.length);const lv=Math.min(1,rms*9*sens);bar.style.width=(lv*100)+'%';
    if(lv>.35&&lv<.98)add(.9);raf=requestAnimationFrame(loop)};loop()}
  catch(e){lab.textContent='Mikrofon tidak dapat dibuka. Guna “Isi manual”.';}};
 micB.onclick=start;
 CLEAN.push(()=>{cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop())})}

try{const d=JSON.parse(localStorage.getItem(GKEY)||'null');if(d)GS={...gNew(),...d}}catch(e){}
const gSave=()=>{try{localStorage.setItem(GKEY,JSON.stringify(GS))}catch(e){}};
const gName=()=>ST.cfg.groups[GS.g]||'Kumpulan';
const gCol=()=>KEYS[GS.g%4].col;

function gTop(){/* bar atas untuk Mod Kumpulan */
 $('#brand').innerHTML=GS.g===null?'<b>📱 Mod Kumpulan</b>':`<b>${GEM[GS.g%6]} ${esc(gName())}</b><span>Ejen Wira Yakin</span>`;
 $('#keys').innerHTML='🔑'+GS.keys.map((k,i)=>`<span class="k ${k?'on':''}">${k?esc(ST.cfg.code[i]):''}</span>`).join('');
}
function gGo(v,ms=0){cleanup();GS.v=v;GS.ms=ms;gSave();ST.view='grp';ST.p=-1;save();
 document.body.classList.add('gm');$('#nav').classList.add('hide');
 const r=(GV[v]||GV.pick)();$('#app').innerHTML=`<div class="screen gscr">${r.h}</div>`;gTop();bindSay($('#app'));r.on&&r.on();window.scrollTo(0,0)}
const gBack=(t='🏠 Markas')=>`<button class="btn sm wh" data-gb>${t}</button>`;
const bindBack=()=>$$('[data-gb]').forEach(b=>b.onclick=()=>gGo('lobi'));
const gHead=(m,title,sub='')=>`<div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="tag" style="background:${gCol()};color:var(--ink)">${MIS[m].ic} MISI ${m+1} · ${MIS[m].n.toUpperCase()}</span>${gBack()}</div><h2 style="margin:.1em 0">${title}</h2>${sub?`<p class="small">${sub}</p>`:''}`;
function kodScreen(i){return{h:`<div class="c">${gHead(i,'🎉 Misi selesai!')}<div class="dg" style="margin-top:10px"><span class="tag y">🔑 KOD KE-${i+1}</span><div class="dgcard">${esc(ST.cfg.code[i])}</div>
 <h2>Kod ke-${i+1} ialah ${esc(ST.cfg.code[i])}</h2><p class="small">Ingat kod ini! Ia akan membuka Peti Wira Yakin di skrin hadapan.</p><button class="btn big gr" id="kk">🏠 Kembali ke Markas</button></div></div>`,
 on(){if(!GS.keys[i]){GS.keys[i]=1;gSave();gTop()}SFX.key();confetti(50);$('#kk').onclick=()=>gGo('lobi');bindBack()}}}

const GV={};
/* ---- Pilih kumpulan ---- */
GV.pick=()=>({h:`<div class="c"><span class="tag y">📱 MOD KUMPULAN</span><h1 style="font-size:clamp(30px,6vw,60px)">Pilih kumpulan kamu</h1>
 <div class="g2" style="max-width:760px;margin:16px auto">${ST.cfg.groups.map((n,i)=>`<button class="keyc" data-g="${i}" style="background:${KEYS[i%4].col};cursor:pointer;font:inherit"><span class="em">${GEM[i%6]}</span><b>${esc(n)}</b></button>`).join('')}</div>
 <button class="btn sm wh" id="gh">⬅ Laman utama</button></div>`,
 on(){$$('[data-g]').forEach(b=>b.onclick=()=>{GS.g=+b.dataset.g;SFX.ok();gGo(GS.ej.length?'lobi':'daftar')});$('#gh').onclick=()=>home()}});
/* ---- Daftar ejen ---- */
GV.daftar=()=>({h:`<div class="row" style="justify-content:space-between"><span class="tag">🪪 DAFTAR EJEN</span>${GS.ej.length?gBack():''}</div>
 <h2>Setiap ejen taip nama sendiri</h2><p class="small">Berani mencuba ialah kunci pertama! (3–8 ejen)</p>
 <div class="row"><input type="text" id="en" placeholder="Nama ejen…" maxlength="18" style="flex:1;min-width:180px"><button class="btn gr" id="ea">➕ Daftar</button></div>
 <div class="chips" id="el" style="justify-content:flex-start;margin:14px 0">${GS.ej.map((e,i)=>`<span class="chip on">${e.av} ${esc(e.n)} <b data-x="${i}" style="cursor:pointer">✖</b></span>`).join('')||'<span class="small">Belum ada ejen.</span>'}</div>
 <button class="btn big pk" id="ed" ${GS.ej.length?'':'disabled'}>🚀 Masuk Markas</button>`,
 on(){const add=()=>{const v=$('#en').value.trim();if(!v||GS.ej.length>=10)return;if(GS.ej.some(e=>e.n.toLowerCase()===v.toLowerCase())){$('#en').value='';return}GS.ej.push({n:v,av:AV[GS.ej.length%AV.length]});SFX.pop();gGo('daftar');setTimeout(()=>$('#en')&&$('#en').focus(),50)};
  $('#ea').onclick=add;$('#en').onkeydown=e=>{if(e.key==='Enter')add()};
  $$('[data-x]').forEach(x=>x.onclick=()=>{GS.ej.splice(+x.dataset.x,1);gGo('daftar')});
  $('#ed').onclick=()=>gGo('lobi');bindBack()}});
/* ---- Markas (lobi) ---- */
const mDone=i=>!!GS.keys[i];
GV.lobi=()=>({h:`<div class="c"><span class="tag" style="background:${gCol()};color:var(--ink)">${GEM[GS.g%6]} MARKAS KUMPULAN ${esc(gName().toUpperCase())}</span>
 <h2>Kumpul 4 kod untuk membuka Peti Wira Yakin!</h2>
 <div class="slots">${[0,1,2,3].map(i=>`<div class="${GS.keys[i]?'on':''}">${GS.keys[i]?esc(ST.cfg.code[i]):'?'}</div>`).join('')}</div></div>
 <div class="g2">${MIS.map((m,i)=>{const lock=i>0&&!mDone(i-1),done=mDone(i);return `<button class="keyc" data-m="${i}" style="background:${done?'#c9f8e1':lock?'#cfd5ec':KEYS[i].col};cursor:${lock?'not-allowed':'pointer'};font:inherit;text-align:left;display:flex;gap:14px;align-items:center;${lock?'opacity:.6':''}"><span class="em">${done?'✅':lock?'🔒':m.ic}</span><span><b>Misi ${i+1}: ${m.n}</b><small>${m.d}</small></span></button>`}).join('')}</div>
 <div class="row cen" style="margin-top:16px"><button class="btn cy" id="gr">🅰️ Kad Respons</button><button class="btn wh" id="gx">📊 Rekod (guru)</button><button class="btn wh" id="ge">👥 Ejen (${GS.ej.length})</button>${GS.keys.every(Boolean)?'<button class="btn pk pulse" id="gl">🏅 Lencana Digital</button>':''}</div>
 <p class="small c" style="margin-top:10px">Tunggu arahan guru sebelum membuka misi seterusnya.</p>`,
 on(){$$('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;if(i>0&&!mDone(i-1)){SFX.no();return}SFX.pop();gGo('m'+(i+1),0)});
  $('#gr').onclick=()=>gGo('resp');$('#gx').onclick=()=>gGo('rekod');$('#ge').onclick=()=>gGo('daftar');const l=$('#gl');if(l)l.onclick=()=>gGo('lencana')}});

/* ---- MISI 1: KENAL ---- */
GV.m1=()=>{const s=GS.ms;
 if(s===0)return{h:`${gHead(0,'📜 Kad Tugasan 1')}<div class="paper"><ol class="steps"><li><span>Pilih <b>peranan</b> secara sukarela (boleh lebih daripada satu).</span></li><li><span>Padankan gambar dengan <b>Kunci Keyakinan</b>. Tablet memberitahu betul atau salah.</span></li><li><span>Setiap ejen lengkapkan <b>Pasport Digital</b>.</span></li></ol></div>
  <h3>🙋 Siapa mahu menjadi…?</h3><div style="display:grid;gap:8px">${GS.ej.map(e=>`<div class="row" style="background:#ffffff18;border-radius:16px;padding:6px 10px"><b style="min-width:120px">${e.av} ${esc(e.n)}</b>${ROLES.map(([ic,r])=>`<button class="tg ${(GS.role[e.n]||[]).includes(r)?'on':''}" data-r="${esc(e.n)}|${r}">${ic} ${r}</button>`).join('')}</div>`).join('')}</div>
  <div class="row cen" style="margin-top:14px"><button class="btn big pk" id="n">Mula padanan ▶</button></div>`,
  on(){$$('[data-r]').forEach(b=>b.onclick=()=>{const[n,r]=b.dataset.r.split('|');const a=GS.role[n]=GS.role[n]||[];const k=a.indexOf(r);k<0?a.push(r):a.splice(k,1);gSave();b.classList.toggle('on');SFX.pop()});$('#n').onclick=()=>gGo('m1',1);bindBack()}};
 if(s===1){const L=shuf([0,1,2,3]),R=shuf([0,1,2,3]);return{h:`${gHead(0,'🔑 Padankan 4 Kunci Keyakinan','Ketik gambar ➜ ketik kunci yang sepadan.')}
  <div class="match" id="mt" style="gap:10px 14px"><div style="display:grid;gap:10px">${L.map(i=>`<div class="mt" data-l="${i}"><span class="em">${KEYS[i].em}</span><span>${KEYS[i].pic}</span></div>`).join('')}</div><div style="display:grid;gap:10px">${R.map(i=>`<div class="mt" data-r="${i}"><span>${KEYS[i].n}</span></div>`).join('')}</div></div>
  <div id="fb"></div>`,
  on(){let sel=null,done=0;bindBack();
   $$('#mt [data-l]').forEach(e=>e.onclick=()=>{if(e.classList.contains('done'))return;$$('#mt [data-l]').forEach(x=>x.classList.remove('sel'));sel=e;e.classList.add('sel');SFX.pop()});
   $$('#mt [data-r]').forEach(e=>e.onclick=()=>{if(!sel||e.classList.contains('done'))return;const a=sel.dataset.l;
    if(a===e.dataset.r){[sel,e].forEach(x=>{x.classList.remove('sel');x.classList.add('done','k'+a)});SFX.ok();say(KEYS[a].n);sel=null;
     if(++done===4){confetti(40);$('#fb').innerHTML=`<div class="fb">🎉 Hebat! 4 Kunci dijumpai.</div><div class="row cen" style="margin-top:12px"><button class="btn big pk" id="n">Seterusnya: Pasport Digital ▶</button></div>`;$('#n').onclick=()=>{GS.m1.pi=0;gGo('m1',2)}}}
    else{GS.m1.err++;gSave();[e,sel].forEach(x=>x.classList.add('bad'));SFX.no();setTimeout(()=>{e.classList.remove('bad');sel&&sel.classList.remove('bad')},450)}})}}}
 if(s===2){const i=GS.m1.pi||0,e=GS.ej[i];if(!e)return kodScreen(0);const w=shuf(['yakin','takut','malu']);let miss=false;
  return{h:`${gHead(0,'🛂 Pasport Digital',`Ejen ${i+1} daripada ${GS.ej.length}`)}<div class="card c"><div style="font-size:54px">${e.av}</div><h3>Giliran: ${esc(e.n)}</h3>
  <p style="font-size:1.3em;font-weight:700;line-height:1.6">Keyakinan diri ialah berasa <span id="bl" style="display:inline-block;min-width:4.5em;border-bottom:5px dashed var(--yl)">&nbsp;</span> dengan kemampuan diri untuk melakukan sesuatu.</p>
  <div class="row cen">${w.map(x=>`<button class="btn wh" data-w="${x}">${x}</button>`).join('')}</div><div id="fb"></div></div>`,
  on(){bindBack();$$('[data-w]').forEach(b=>b.onclick=()=>{if(b.dataset.w==='yakin'){$('#bl').textContent='yakin';$('#bl').style.color='var(--gr)';GS.m1.pas[e.n]=miss?1:2;gSave();SFX.ok();say(DEFN);
    $('#fb').innerHTML=`<div class="fb">✅ Cop Pasport untuk ${esc(e.n)}!</div><div class="row cen" style="margin-top:10px"><button class="btn big pk" id="n">${i+1<GS.ej.length?'Ejen seterusnya ▶':'Ambil Kod ke-1 🔑'}</button></div>`;$$('[data-w]').forEach(x=>x.disabled=true);
    $('#n').onclick=()=>{GS.m1.pi=i+1;gSave();gGo('m1',i+1<GS.ej.length?2:3)}}
   else{miss=true;b.disabled=true;SFX.no();$('#fb').innerHTML='<div class="fb y">🔁 Cuba lagi! Silap itu biasa.</div>'}})}}}
 return kodScreen(0)};

/* ---- MISI 2: PILIH ---- */
function boardHTML(){const p=GS.m2.place;const col=y=>BEH.map((b,i)=>p[i]===y?`<div class="bc"><span class="em">${b.em}</span><span>${esc(b.t)}</span></div>`:'').join('');
 return `<div class="bins"><div class="bin gn"><h3><span class="lamp"></span>YAKIN</h3>${col(1)}</div><div class="bin rd"><h3><span class="lamp"></span>BELUM YAKIN</h3>${col(0)}</div></div>`}
GV.m2=()=>{const s=GS.ms;
 if(s===0)return{h:`${gHead(1,'📜 Kad Tugasan 2')}<div class="paper"><ol class="steps"><li><span>Baca 8 kad tingkah laku bersama-sama (Pembaca).</span></li><li><span>Ketik kad ➜ ketik <b style="color:#17905a">🟢 YAKIN</b> atau <b style="color:#c23a4f">🔴 BELUM YAKIN</b> (Penyusun).</span></li><li><span>Tekan <b>Semak</b>. Kad yang salah melantun balik: bincang dan betulkan (Penyemak).</span></li><li><span>Ubah satu kad merah menjadi hijau.</span></li></ol></div><div class="row cen" style="margin-top:14px"><button class="btn big pk" id="n">Mula ▶</button></div>`,on(){$('#n').onclick=()=>gGo('m2',1);bindBack()}};
 if(s===1){return{h:`${gHead(1,'🚦 Lampu Isyarat Keyakinan','Letakkan semua kad, kemudian tekan Semak.')}
  <div class="tray" id="tray"></div><div class="bins"><div class="bin gn" data-y="1"><h3><span class="lamp"></span>YAKIN</h3><div class="bx"></div></div><div class="bin rd" data-y="0"><h3><span class="lamp"></span>BELUM YAKIN</h3><div class="bx"></div></div></div>
  <div class="row cen" style="margin-top:12px"><button class="btn big cy" id="ck" disabled>🔍 Semak</button></div><div id="fb"></div>`,
  on(){bindBack();const P=GS.m2.place;let sel=null;
   const draw=()=>{const tray=$('#tray');tray.innerHTML='';$$('.bin .bx').forEach(b=>b.innerHTML='');
    shuf(BEH.map((b,i)=>i)).forEach(i=>{const b=BEH[i],d=document.createElement('div');d.className='bc';d.dataset.i=i;d.innerHTML=`<span class="em">${b.em}</span><span>${esc(b.t)}</span>`;
     (P[i]===undefined?tray:document.querySelector(`.bin[data-y="${P[i]}"] .bx`)).appendChild(d);
     d.onclick=e=>{e.stopPropagation();const bin=d.closest('.bin');if(sel&&sel!==d&&bin){P[+sel.dataset.i]=+bin.dataset.y;gSave();sel=null;SFX.pop();draw();return}$$('.bc').forEach(x=>x.classList.remove('sel'));sel=d;d.classList.add('sel');SFX.pop()}});
    if(!tray.children.length)tray.innerHTML='<span class="small">Semua kad sudah diletakkan. Tekan Semak!</span>';
    $('#ck').disabled=Object.keys(P).length<8};
   $$('.bin').forEach(b=>b.onclick=()=>{if(!sel)return;P[+sel.dataset.i]=+b.dataset.y;gSave();sel=null;SFX.pop();draw()});
   $('#ck').onclick=()=>{let ok=0,wrong=[];BEH.forEach((b,i)=>{if(P[i]===b.y)ok++;else wrong.push(i)});GS.m2.checks++;if(GS.m2.first===null)GS.m2.first=ok;
    if(!wrong.length){gSave();SFX.fan();confetti(50);$('#fb').innerHTML=`<div class="fb">🎉 8/8 betul! Lampu kamu bersinar.</div><div class="row cen" style="margin-top:10px"><button class="btn big pk" id="n">Seterusnya ▶</button></div>`;$('#n').onclick=()=>gGo('m2',2);$('#ck').disabled=true;return}
    wrong.forEach(i=>delete P[i]);gSave();SFX.no();draw();$('#fb').innerHTML=`<div class="fb y">✅ ${ok}/8 betul. ${wrong.length} kad melantun balik: ${wrong.map(i=>BEH[i].em).join(' ')}. Bincang dan cuba lagi!</div>`;say('Bincang dan cuba lagi!')};
   draw()}}}
 if(s===2){const red=GS.m2.uc;if(red===null||red===undefined)return{h:`${gHead(1,'🔄 Ubah Merah ➜ Hijau','Pilih satu kad merah yang kumpulan mahu ubah.')}<div class="g2">${[4,5,6,7].map(i=>`<button class="mt" data-u="${i}" style="font:inherit"><span class="em">${BEH[i].em}</span><span>${esc(BEH[i].t)}</span></button>`).join('')}</div>`,on(){bindBack();$$('[data-u]').forEach(b=>b.onclick=()=>{GS.m2.uc=+b.dataset.u;gSave();gGo('m2',2)})}};
  const u=UBAH[red],o=shuf(u.o.map((t,i)=>({t,i})));let miss=false;
  return{h:`${gHead(1,'🔄 Ubah Merah ➜ Hijau')}<div class="card"><p><b>Kad merah:</b> ${u.q}</p><h3>Apakah tingkah laku YAKIN untuk menggantikannya?</h3><div class="opts">${o.map((x,k)=>`<div class="opt ${'ABC'[k]}" data-o="${x.i}"><b>${'ABC'[k]}</b><span>${esc(x.t)}</span></div>`).join('')}</div><div id="fb"></div></div>`,
  on(){bindBack();$$('[data-o]').forEach(d=>d.onclick=()=>{if(+d.dataset.o===0){d.classList.add('win');if(GS.m2.ubah===null)GS.m2.ubah=miss?0:1;gSave();SFX.ok();$('#fb').innerHTML=`<div class="fb">🟢 Hebat! Kad merah sudah menjadi hijau.</div><div class="row cen" style="margin-top:10px"><button class="btn big pk" id="n">Papan Hasil Kumpulan ▶</button></div>`;$('#n').onclick=()=>gGo('m2',3)}else{miss=true;d.classList.add('dim');SFX.no()}})}}}
 if(s===3)return{h:`${gHead(1,'🖼️ Papan Hasil Kumpulan',`Gallery Walk: pelawat dari kumpulan lain, beri bintang dan pujian!`)}${boardHTML()}
  ${GS.m2.uc!=null?`<div class="tip" style="margin-top:10px">🔄 Kad merah diubah: ${UBAH[GS.m2.uc].q} ➜ <b>${esc(UBAH[GS.m2.uc].o[0])}</b></div>`:''}
  <div class="card c"><h3>Untuk pelawat 👀</h3><div class="row cen"><button class="btn big" id="st">⭐ Beri Bintang (<span id="sn">${GS.gw.st}</span>)</button>${Object.keys(GS.gw.em).map(k=>`<button class="btn wh" data-e="${k}">${k} <span>${GS.gw.em[k]}</span></button>`).join('')}</div></div>
  <div class="row cen"><button class="btn gr big" id="n">🔑 Ambil Kod ke-2</button></div>`,
  on(){bindBack();$('#st').onclick=()=>{GS.gw.st++;gSave();$('#sn').textContent=GS.gw.st;SFX.ok();confetti(15)};$$('[data-e]').forEach(b=>b.onclick=()=>{GS.gw.em[b.dataset.e]++;gSave();b.querySelector('span').textContent=GS.gw.em[b.dataset.e];SFX.pop()});$('#n').onclick=()=>gGo('m2',4)}};
 return kodScreen(1)};

/* ---- MISI 3: BERTINDAK ---- */
function puzzle(){if(!GS.m3.pzr){GS.m3.pzr=[0,1,2,3].map(()=>1+(Math.random()*3|0));gSave()}const rot=GS.m3.pzr;
 return `<div id="pz" style="display:grid;grid-template-columns:1fr 1fr;gap:4px;width:min(320px,80vw);margin:0 auto">${[0,1,2,3].map(i=>`<div data-p="${i}" style="aspect-ratio:1;background:url(${ART}) ${i%2?'100%':'0'} ${i>1?'100%':'0'}/200% 200%;border:3px solid #fff;border-radius:10px;cursor:pointer;transition:transform .3s;transform:rotate(${rot[i]*90}deg)"></div>`).join('')}</div>`}
GV.m3=()=>{const s=GS.ms,c=CH[GS.m3.c];
 if(s===0)return{h:`${gHead(2,'🎡 Cabaran kumpulan kamu','Lihat Roda Cabaran di skrin hadapan. Ketik nombor cabaran yang sama.')}<div class="g2">${CH.map((x,i)=>`<button class="keyc" data-c="${i}" style="background:${x.c};font:inherit;cursor:pointer"><span class="em">${x.em}</span><b>Cabaran ${i+1}</b><small>${x.n}</small></button>`).join('')}</div>`,
  on(){bindBack();$$('[data-c]').forEach(b=>b.onclick=()=>{GS.m3.c=+b.dataset.c;GS.m3.k=null;GS.m3.pzr=null;GS.m3.pz=0;gSave();gGo('m3',1)})}};
 if(!c)return GV.m3(GS.ms=0);
 if(s===1){let miss=false;return{h:`${gHead(2,`${c.em} Cabaran ${GS.m3.c+1}: ${c.n}`)}<div class="tip">📖 <b>Situasi:</b> ${esc(c.s)}</div><div class="card"><h3>🧠 ${esc(c.q)} ${spk(c.s+' '+c.q)}</h3><div class="opts">${c.o.map((t,k)=>`<div class="opt ${'ABC'[k]}" data-o="${k}"><b>${'ABC'[k]}</b><span>${esc(t)}</span></div>`).join('')}</div><div id="fb"></div></div>`,
  on(){bindBack();$$('[data-o]').forEach(d=>d.onclick=()=>{if(+d.dataset.o===c.a){d.classList.add('win');if(GS.m3.k===null)GS.m3.k=miss?0:1;gSave();SFX.ok();say(c.f);$('#fb').innerHTML=`<div class="fb">✅ ${esc(c.f)}</div><div class="row cen" style="margin-top:10px"><button class="btn big pk" id="n">✋ Sekarang Tunjukkan ▶</button></div>`;$('#n').onclick=()=>gGo('m3',2)}else{miss=true;d.classList.add('dim');SFX.no()}})}}}
 if(s===2){const prop=[`<p class="c" style="font-weight:700">Pegang tablet seperti mikrofon 🎤 dan sebut: “Idea saya ialah …”</p>${vmeter('gv')}`,
   `<div class="paper c" style="font-size:clamp(24px,3.4vw,44px);font-weight:700;line-height:1.5">${BACA}</div><p class="small c">Sengaja tersilap satu perkataan ➜ “Oops, saya betulkan!” ➜ baca semula dengan jelas.</p>${vmeter('gv')}`,
   `<p class="c" style="font-weight:700">Sebut “Saya akan cuba dahulu!” kemudian ketik kepingan untuk memusingkannya.</p>${puzzle()}<div id="pzf"></div>`,
   `<p class="c" style="font-weight:700">Angkat tablet. “Ini hasil kerja kami…”</p>${boardHTML()}`][GS.m3.c];
  return{h:`${gHead(2,'✋ Tunjukkan dengan Gaya Wira Yakin',`Prop digital: ${c.prop}`)}<div class="card">${prop}</div>
  <div class="card"><h3>🔍 Penyemak: ketik gaya yang kamu nampak</h3><div class="gaya" id="gy">${GAYA.map((x,i)=>`<div class="gy ${GS.m3.g[i]?'on':''}" data-i="${i}"><span class="em">${x.em}</span>${x.n}</div>`).join('')}</div>
  <div class="row cen" style="margin-top:10px">${ring(T(45,30))}<button class="btn gr" id="goRing">▶ ${T(45,30)} saat</button></div></div>
  <div class="row cen"><button class="btn big pk" id="n">💖 Seterusnya: Sebut ▶</button></div>`,
  on(){bindBack();bindRing();if(GS.m3.c<2)bindVm('gv');
   $$('#gy .gy').forEach(x=>x.onclick=()=>{GS.m3.g[+x.dataset.i]=GS.m3.g[+x.dataset.i]?0:1;gSave();x.classList.toggle('on');SFX.pop()});
   if(GS.m3.c===2)$$('#pz [data-p]').forEach(p=>p.onclick=()=>{const i=+p.dataset.p;GS.m3.pzr[i]=(GS.m3.pzr[i]+1)%4;p.style.transform=`rotate(${GS.m3.pzr[i]*90}deg)`;SFX.pop();gSave();
    if(GS.m3.pzr.every(r=>r===0)){GS.m3.pz=1;gSave();SFX.fan();confetti(40);$('#pzf').innerHTML='<div class="fb">🧩 Berjaya! Kamu cuba dahulu dan berjaya!</div>'}});
   $('#n').onclick=()=>gGo('m3',3)}}}
 if(s===3)return{h:`${gHead(2,'💖 Sebut bersama dengan suara jelas!')}<div class="paper c" style="font-size:clamp(24px,3.4vw,46px);font-weight:700">“${esc(c.say)}”</div><div class="card">${vmeter('gv2')}</div>
  <div class="row cen"><button class="btn gr big" id="n">🔑 Ambil Kod ke-3</button></div>`,
  on(){bindBack();bindVm('gv2',()=>{GS.m3.vm=1;gSave()});$('#n').onclick=()=>gGo('m3',4)}};
 return kodScreen(2)};

/* ---- MISI 4: REFLEKSI ---- */
GV.m4=()=>{const s=GS.ms;
 if(s===0)return{h:`${gHead(3,'⭐ Dinding Kumpulan “Saya Boleh!”','Setiap ejen ketik nama sendiri dan tulis satu azam.')}
  <div class="chips" style="justify-content:flex-start">${GS.ej.map((e,i)=>`<span class="chip ${GS.m4.az[e.n]?'done':''}" data-a="${i}">${e.av} ${esc(e.n)} ${GS.m4.az[e.n]?'✅':'✏️'}</span>`).join('')}</div>
  <div id="ed" class="card hide"><h3 id="who"></h3><div class="row"><input type="text" id="az" placeholder="Saya boleh …" maxlength="60" style="flex:1;min-width:200px"><button class="btn gr" id="sv">📌 Tampal</button></div>
  <div class="chips" style="justify-content:flex-start;margin-top:8px">${['mengangkat tangan','bercakap dengan jelas','cuba lagi','membaca di hadapan kelas','berkata positif'].map(x=>`<span class="chip" data-s="Saya boleh ${x}">Saya boleh ${x}</span>`).join('')}</div></div>
  <div class="wall" id="wall" style="margin-top:10px">${GS.ej.filter(e=>GS.m4.az[e.n]).map((e,i)=>`<div class="note" style="background:${NC[i%NC.length]};transform:rotate(${(i*37%15)-7}deg)"><span>${esc(GS.m4.az[e.n])}<br><small>– ${esc(e.n)}</small></span></div>`).join('')||'<div class="empty">📌 Dinding masih kosong.</div>'}</div>
  <div class="row cen" style="margin-top:12px"><button class="btn big pk" id="n">Seterusnya: Meter Keyakinan ▶</button></div>`,
  on(){bindBack();let who=null;$$('[data-a]').forEach(c=>c.onclick=()=>{who=GS.ej[+c.dataset.a];$('#ed').classList.remove('hide');$('#who').textContent=`${who.av} ${who.n}, apakah azam kamu?`;$('#az').value=GS.m4.az[who.n]||'';$('#az').focus()});
   const put=t=>{t=t.trim();if(!who||!t)return;if(!/^saya boleh/i.test(t))t='Saya boleh '+t;GS.m4.az[who.n]=t;gSave();SFX.pop();gGo('m4',0)};
   $('#sv').onclick=()=>put($('#az').value);$('#az').onkeydown=e=>{if(e.key==='Enter')put($('#az').value)};$$('[data-s]').forEach(c=>c.onclick=()=>put(c.dataset.s));
   $('#n').onclick=()=>gGo('m4',1)}};
 if(s===1)return{h:`${gHead(3,'💖 Meter Keyakinan Saya Sekarang','Setiap ejen ketik wajah yang sesuai. Tiada jawapan salah.')}
  <div style="display:grid;gap:8px">${GS.ej.map(e=>`<div class="row" style="background:#ffffff18;border-radius:16px;padding:6px 10px;justify-content:space-between"><b>${e.av} ${esc(e.n)}</b><span class="row" style="gap:6px">${MEMO.map((m,i)=>`<button class="tg ${GS.m4.mt[e.n]===i?'on':''}" data-t="${esc(e.n)}|${i}" title="${m[1]}" style="font-size:26px">${m[0]}</button>`).join('')}</span></div>`).join('')}</div>
  <div class="row cen" style="margin-top:14px"><button class="btn gr big" id="n">🔑 Ambil Kod ke-4</button></div>`,
  on(){bindBack();$$('[data-t]').forEach(b=>b.onclick=()=>{const[n,i]=b.dataset.t.split('|');GS.m4.mt[n]=+i;gSave();b.parentElement.querySelectorAll('.tg').forEach(x=>x.classList.remove('on'));b.classList.add('on');SFX.pop()});$('#n').onclick=()=>gGo('m4',2)}};
 return kodScreen(3)};

/* ---- Lencana Digital ---- */
GV.lencana=()=>{const ik='Saya Wira Yakin! Saya berani mencuba. Saya bercakap dengan jelas. Saya berkata positif. Saya cuba lagi. Saya yakin, saya boleh!';
 return{h:`<div class="row" style="justify-content:space-between">${gBack()}</div><div class="c"><div style="font-size:clamp(80px,12vw,150px);animation:flt 2.5s infinite">🏅</div>
 <div class="paper" style="max-width:780px;margin:0 auto;border:8px double #e6b800"><span class="tag y">LENCANA DIGITAL</span><h1 style="color:var(--ink);text-shadow:none;font-size:clamp(28px,4vw,52px)">WIRA YAKIN DIRI</h1>
 <p>Dianugerahkan kepada ejen Kumpulan <b>${esc(gName())}</b> · ${esc(ST.cfg.cls)}</p>
 <div class="chips">${GS.ej.map(e=>`<span class="chip on">${e.av} ${esc(e.n)}</span>`).join('')}</div>
 <p style="margin-top:10px"><b>Kod Peti:</b> ${esc(ST.cfg.code.split('').join(' · '))}</p></div>
 <div class="card" style="max-width:780px;margin:14px auto"><h3>🙌 Ikrar Wira Yakin</h3><p class="karaoke" id="ik" style="font-weight:700;font-size:1.2em;line-height:1.6">${ik.split(' ').map(x=>`<span>${esc(x)}</span>`).join(' ')}</p><button class="btn pk" id="bik">🎤 Lafaz bersama</button></div></div>`,
 on(){bindBack();confetti(80);SFX.fan();$('#bik').onclick=()=>{const sp=$$('#ik span');let i=0;say(ik);const t=setInterval(()=>{sp.forEach(s=>s.classList.remove('on'));if(i>=sp.length){clearInterval(t);return}sp[i++].classList.add('on')},420);CLEAN.push(()=>clearInterval(t))}}}};

/* ---- Rekod Kumpulan (bukti pentaksiran untuk guru) ---- */
function gTP(){const p=GS.ej.length?GS.ej.filter(e=>GS.m1.pas[e.n]).length/GS.ej.length:0,g=GS.m3.g.reduce((a,b)=>a+b,0);
 if(p>=.5&&GS.m2.first>=6&&GS.m3.k&&g>=3)return 4;if(p>=.5&&GS.m2.first>=6)return 3;if(p>=.5||GS.m2.first>=4)return 2;return p||GS.m2.first?1:'–'}
GV.rekod=()=>({h:`<div class="row" style="justify-content:space-between"><h2 style="margin:0">📊 Rekod Kumpulan ${esc(gName())}</h2>${gBack()}</div>
 <div class="paper" style="margin-top:10px"><table class="ck"><tr><th>Ejen</th><th>Peranan sukarela (A1)</th><th>Pasport K(i)</th><th>Meter keyakinan</th><th>Azam (A2)</th></tr>
 ${GS.ej.map(e=>`<tr><td>${e.av} ${esc(e.n)}</td><td>${(GS.role[e.n]||[]).join(', ')||'—'}</td><td>${GS.m1.pas[e.n]===2?'✅ kali pertama':GS.m1.pas[e.n]===1?'✅ selepas cuba lagi':'—'}</td><td>${GS.m4.mt[e.n]!==undefined?MEMO[GS.m4.mt[e.n]][0]+' '+MEMO[GS.m4.mt[e.n]][1]:'—'}</td><td style="text-align:left">${esc(GS.m4.az[e.n]||'—')}</td></tr>`).join('')}</table>
 <table class="ck" style="margin-top:12px"><tr><th>Bukti kumpulan</th><th>Hasil</th></tr>
 <tr><td>Padanan 4 Kunci (percubaan salah)</td><td>${GS.keys[0]?GS.m1.err:'—'}</td></tr>
 <tr><td>Lampu Isyarat: skor semakan pertama (K)</td><td>${GS.m2.first===null?'—':GS.m2.first+'/8'} (semakan: ${GS.m2.checks})</td></tr>
 <tr><td>Ubah merah ➜ hijau</td><td>${GS.m2.ubah===null?'—':GS.m2.ubah?'✅ kali pertama':'✅ selepas cuba lagi'}</td></tr>
 <tr><td>Cabaran dipilih · Fikir & Pilih (K)</td><td>${GS.m3.c===null?'—':'Cabaran '+(GS.m3.c+1)+' · '+(GS.m3.k===null?'—':GS.m3.k?'✅ kali pertama':'✅ selepas cuba lagi')}</td></tr>
 <tr><td>Gaya Wira Yakin (P)</td><td>${GAYA.map((x,i)=>GS.m3.g[i]?x.em:'·').join(' ')} ${GS.m3.g.reduce((a,b)=>a+b,0)}/4</td></tr>
 <tr><td>Meter Suara penuh (P)</td><td>${GS.m3.vm?'✅':'—'}</td></tr>
 <tr><td>Gallery Walk: bintang & pujian</td><td>⭐ ${GS.gw.st} · ${Object.entries(GS.gw.em).map(([k,v])=>k+' '+v).join(' ')}</td></tr>
 <tr><td><b>Cadangan TP kumpulan</b></td><td><b>TP${gTP()}</b></td></tr></table>
 <div class="row" style="margin-top:12px"><button class="btn sm cy" id="csv">⬇️ Muat turun CSV</button><button class="btn sm pk" id="rs">♻️ Set semula tablet ini</button></div></div>`,
 on(){bindBack();$('#csv').onclick=()=>{const L=[['Kumpulan','Ejen','Peranan','Pasport','Meter','Azam']];GS.ej.forEach(e=>L.push([gName(),e.n,(GS.role[e.n]||[]).join(' / '),GS.m1.pas[e.n]||0,GS.m4.mt[e.n]??'',(GS.m4.az[e.n]||'').replace(/,/g,' ')]));
   L.push([]);L.push(['Sisih pertama',GS.m2.first??'','Cabaran',GS.m3.c===null?'':GS.m3.c+1,'Gaya',GS.m3.g.reduce((a,b)=>a+b,0)]);L.push(['Cadangan TP','TP'+gTP()]);
   const b=new Blob(['﻿'+L.map(r=>r.join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`rekod-${gName()}.csv`;a.click()};
  $('#rs').onclick=()=>{if(confirm('Set semula semua data kumpulan pada tablet ini?')){GS=gNew();gSave();gGo('pick')}}}});

/* ---- Kad Respons Digital (A/B/C) ---- */
GV.resp=()=>({h:`<div class="row" style="justify-content:space-between"><span class="tag">🅰️ KAD RESPONS DIGITAL</span>${GS.g===null?'<button class="btn sm wh" id="rh">⬅ Laman utama</button>':gBack()}</div>
 <p class="c">Selepas guru berkata <b>“Kira 3-2-1”</b>, ketik jawapan dan <b>angkat skrin</b>.</p>
 <div style="display:grid;gap:14px;grid-template-columns:repeat(3,1fr)">${[['A','var(--pk)'],['B','var(--yl)'],['C','var(--gr)']].map(([l,c])=>`<button data-l="${l}" style="background:${c};border:6px solid #fff;border-radius:28px;font:inherit;font-weight:700;font-size:clamp(70px,16vw,180px);color:#fff;text-shadow:0 6px 0 #0004;aspect-ratio:.8;cursor:pointer;box-shadow:0 8px 0 var(--shadow)">${l}</button>`).join('')}</div>`,
 on(){const rh=$('#rh');if(rh)rh.onclick=()=>home();bindBack();
  $$('[data-l]').forEach(b=>b.onclick=()=>{SFX.pop();ov.innerHTML=`<div style="position:fixed;inset:0;display:grid;place-items:center;background:${b.style.background};font-family:Fredoka;font-weight:700;font-size:min(70vw,80vh);color:#fff;text-shadow:0 12px 0 #0004" data-close>${b.dataset.l}</div>`;ov.classList.add('on');ov.onclick=()=>hideOv()})}});

function startGroup(){ST.view='grp';save();gGo(GS.g===null?'pick':(GS.v&&GV[GS.v]?GS.v:'lobi'),GS.ms||0)}

/* ---------------- Papan kekunci ---------------- */
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;
 if(['ArrowRight','PageDown',' '].includes(e.key)){if(ov.classList.contains('on'))return;e.preventDefault();next()}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back()}
 else if(e.key==='f'||e.key==='F')toggleFs();
 else if(e.key==='m'||e.key==='M'){ST.cfg.snd=!ST.cfg.snd;save();drawTop()}
 else if(e.key==='c'||e.key==='C')openChk();
 else if(e.key==='t'||e.key==='T'){TM.run=!TM.run;drawTimer()}
 else if(e.key==='h'||e.key==='H')home();
 else if(e.key==='Escape')hideOv()});
function toggleFs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
$('#bFs').onclick=toggleFs;$('#bSnd').onclick=()=>{ST.cfg.snd=!ST.cfg.snd;save();drawTop()};$('#bChk').onclick=openChk;

/* ---------------- Mula ---------------- */
ambient();
if(ST.view==='grp')startGroup();else if(ST.p>=0&&ST.p<PH.length)go(ST.p,Math.min(ST.s,PH[ST.p].steps.length-1));else home();
</script>
</body>
</html>
