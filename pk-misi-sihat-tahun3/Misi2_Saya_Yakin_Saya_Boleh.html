:root{
  --bg:#172b78;--bg2:#243c9a;--deep:#0f1d57;--pk:#ff70b7;--yl:#ffe34d;--gr:#5ee8a8;--cy:#63e3ff;--or:#ff9c45;--rd:#ff5d6c;
  --ink:#172b78;--paper:#fffdf4;--shadow:#0b1650;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:Fredoka,'Baloo 2','Comic Sans MS',system-ui,sans-serif;font-weight:500;color:#fff;
  font-size:clamp(17px,1.55vw,26px);
  background:radial-gradient(circle at 12% 18%,#4269dc 0,transparent 30%),radial-gradient(circle at 88% 30%,#673fb3 0,transparent 28%),linear-gradient(145deg,#172b78 0%,#243c9a 50%,#18296f 100%);
  background-attachment:fixed;overflow-x:hidden;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.16;background-image:radial-gradient(#fff 1.4px,transparent 1.4px);background-size:34px 34px}
button{font:inherit;color:inherit}
.hide{display:none!important}

/* ---------- Bar atas ---------- */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(90deg,#122166,#2a40a0,#122166);box-shadow:0 5px 18px #07164f88;flex-wrap:wrap}
#top .brand{font-weight:700;font-size:clamp(14px,1.2vw,20px);display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
#top .brand b{background:var(--yl);color:var(--ink);border-radius:12px;padding:2px 9px}
#path{display:flex;gap:4px;flex:1;justify-content:center;min-width:280px}
#path .pp{display:flex;flex-direction:column;align-items:center;font-size:clamp(10px,.8vw,13px);font-weight:700;opacity:.65;min-width:52px;cursor:pointer;background:none;border:0;padding:0}
#path .pp i{font-style:normal;display:grid;place-items:center;width:clamp(28px,2.4vw,38px);height:clamp(28px,2.4vw,38px);border-radius:50%;border:3px solid #fff8;background:#ffffff18;font-size:clamp(14px,1.2vw,20px);margin-bottom:2px}
#path .pp.done{opacity:1}#path .pp.done i{background:var(--gr);border-color:#fff}
#path .pp.now{opacity:1}#path .pp.now i{background:var(--yl);border-color:#fff;animation:bnc 1.2s infinite}
#path .ln{flex:0 0 14px;height:3px;background:#fff4;align-self:center;margin-top:-14px;border-radius:3px}
#keys{display:flex;gap:4px;align-items:center;background:#0b1650aa;border:2px solid #fff6;border-radius:16px;padding:4px 8px}
#keys .k{width:26px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:15px;background:#ffffff14;border:2px dashed #fff6}
#keys .k.on{background:var(--yl);border:2px solid #fff;animation:pop .6s}
#timer{font-weight:700;background:#fff;color:var(--ink);border:0;border-radius:16px;padding:4px 12px;min-width:92px;cursor:pointer;box-shadow:0 4px 0 var(--shadow);font-size:clamp(14px,1.2vw,20px)}
#timer.run{background:var(--gr)}#timer.late{background:var(--rd);color:#fff;animation:bnc 1s infinite}
.tb{border:0;background:#ffffff22;border-radius:12px;padding:5px 9px;cursor:pointer;font-size:clamp(14px,1.1vw,19px)}
.tb:hover{background:#ffffff40}

/* ---------- Asas ---------- */
main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:14px 18px 110px}
.screen{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;background:var(--pk);color:#fff;border:3px solid #fff;border-radius:999px;padding:3px 14px;font-weight:700;font-size:.72em;letter-spacing:.04em;box-shadow:0 4px 0 var(--shadow)}
.tag.y{background:var(--yl);color:var(--ink)}.tag.g{background:var(--gr);color:var(--ink)}.tag.c{background:var(--cy);color:var(--ink)}
h1{font-size:clamp(34px,4.8vw,78px);margin:.12em 0;color:var(--yl);text-shadow:0 5px 0 #0008;line-height:1.05}
h2{font-size:clamp(26px,3vw,50px);margin:.25em 0;line-height:1.1;text-shadow:0 3px 0 #0006}
h3{font-size:clamp(20px,1.9vw,32px);margin:.3em 0}
p{margin:.4em 0}
.c{text-align:center}
.card{position:relative;background:linear-gradient(145deg,#3154c2,#203d9c 58%,#182d7a);border:5px solid #fff;border-radius:32px;padding:clamp(14px,1.6vw,26px);margin:12px 0;box-shadow:0 10px 0 var(--shadow),0 18px 30px #06134455}
.paper{background:var(--paper);color:var(--ink);border:5px solid #fff;border-radius:28px;padding:clamp(14px,1.6vw,26px);box-shadow:0 10px 0 var(--shadow)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.row.cen{justify-content:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;gap:.4em;font-weight:700;font-size:clamp(17px,1.5vw,26px);border:4px solid #fff;border-radius:24px;padding:.45em 1em;cursor:pointer;color:var(--ink);background:var(--yl);box-shadow:0 7px 0 var(--shadow),0 10px 18px #07134455;transition:transform .18s,filter .18s}
.btn:hover,.btn:focus-visible{transform:translateY(-4px) rotate(-1deg) scale(1.03);filter:brightness(1.07);outline:none}
.btn:active{transform:translateY(3px) scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pk{background:var(--pk);color:#fff}.btn.gr{background:var(--gr)}.btn.cy{background:var(--cy)}.btn.wh{background:#fff}.btn.or{background:var(--or)}
.btn.sm{font-size:clamp(14px,1.05vw,18px);padding:.32em .8em;border-width:3px;box-shadow:0 4px 0 var(--shadow)}
.btn.big{font-size:clamp(22px,2.2vw,38px);padding:.5em 1.3em}
.pulse{animation:pulse 1.6s infinite}

/* ---------- Navigasi bawah ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:linear-gradient(0deg,#0e1b55,#0e1b55cc 70%,transparent)}
#nav .dots{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
#nav .dots i{width:13px;height:13px;border-radius:50%;background:#fff5;display:block}
#nav .dots i.on{background:var(--yl);transform:scale(1.35)}
#nav .lbl{font-size:clamp(12px,.9vw,15px);opacity:.85;font-weight:700;text-align:center}

/* ---------- Pilihan A/B/C (selari dengan Kad Respons fizikal) ---------- */
.opts{display:grid;gap:14px;margin-top:12px}
.opt{display:flex;align-items:center;gap:.6em;text-align:left;font-weight:700;font-size:clamp(20px,2vw,34px);padding:.55em .9em;min-height:72px;border:5px solid #fff;border-radius:24px;color:var(--ink);cursor:pointer;box-shadow:0 7px 0 var(--shadow);transition:transform .2s,opacity .3s,filter .3s}
.opt b{flex:0 0 auto;display:grid;place-items:center;width:1.7em;height:1.7em;background:#fff;border-radius:50%;font-size:1.05em}
.opt.A{background:var(--pk)}.opt.B{background:var(--yl)}.opt.C{background:var(--gr)}
.opt:hover{transform:translateX(6px)}
.opt.dim{opacity:.35;filter:grayscale(.6)}
.opt.win{outline:8px solid #fff;outline-offset:3px;animation:pop .6s}
.opt.win::after{content:"✔";margin-left:auto;font-size:1.3em}
.fb{margin-top:14px;padding:12px 16px;border-radius:20px;border:4px solid #fff;font-weight:700;font-size:1.1em;background:var(--gr);color:var(--ink);animation:msg .45s}
.fb.y{background:var(--yl)}

/* ---------- Kad Tugasan (Gaya B: Latihan) ---------- */
.task{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.env{position:relative;width:clamp(120px,13vw,200px);aspect-ratio:1.45;background:linear-gradient(160deg,#ffe9a8,#ffd25c);border:4px solid #fff;border-radius:14px;box-shadow:0 8px 0 var(--shadow);display:grid;place-items:center;font-size:clamp(34px,4vw,64px);color:var(--ink);font-weight:700}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,transparent 49%,#e8b73f 50%) top/100% 55% no-repeat,linear-gradient(-155deg,transparent 49%,#e8b73f 50%) top/100% 55% no-repeat;border-radius:10px}
.env.tab{background:linear-gradient(160deg,#2b3b7a,#11194a);border-radius:22px;border:6px solid #e8ecff}
.env.tab::before{display:none}
.env span{position:relative;z-index:1;background:#fff;border-radius:50%;width:1.5em;height:1.5em;display:grid;place-items:center;font-size:.7em;border:3px solid var(--ink)}
.env em{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:var(--pk);color:#fff;font-style:normal;font-size:clamp(12px,1vw,16px);padding:2px 10px;border-radius:12px;border:2px solid #fff;white-space:nowrap}
.steps{margin:.3em 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:.6em;align-items:flex-start;margin:.45em 0;font-size:1.05em}
.steps li::before{content:counter(s);flex:0 0 1.6em;height:1.6em;border-radius:50%;background:var(--yl);color:var(--ink);display:grid;place-items:center;font-weight:700;border:3px solid #fff}
.paper .steps li::before{border-color:var(--ink)}

/* ---------- Pemasa aktiviti ---------- */
.ring{position:relative;width:clamp(120px,11vw,170px);aspect-ratio:1;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:clamp(26px,2.4vw,40px)}
.ring.end .t{color:var(--rd);animation:bnc .8s infinite}

/* ---------- Mei ---------- */
.mei{width:clamp(150px,15vw,250px);display:block;margin:0 auto}
.mei *{transition:all .7s cubic-bezier(.3,1.4,.5,1)}
.meter{position:relative;height:30px;border-radius:20px;background:#0b1650;border:4px solid #fff;overflow:hidden}
.meter u{position:absolute;left:0;top:0;bottom:0;width:10%;background:linear-gradient(90deg,var(--rd),var(--or),var(--yl),var(--gr));transition:width 1.2s cubic-bezier(.3,1.3,.5,1)}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;text-shadow:0 2px 2px #000a}
.bubble{position:relative;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:24px;padding:12px 16px;font-weight:700;font-size:1.05em;box-shadow:0 6px 0 #0b165066}
.bubble::after{content:"";position:absolute;left:-16px;top:34px;width:22px;height:22px;background:#fff;border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg)}
.scene{position:relative;border:5px solid #fff;border-radius:30px;background:linear-gradient(#9fe8ff,#eafcff 70%,#ffe2a8 70%,#f5c978);overflow:hidden;padding:14px;box-shadow:0 10px 0 var(--shadow)}
.scene .board{position:absolute;left:4%;top:8%;width:28%;aspect-ratio:1.6;background:#1f6b46;border:8px solid #a86b33;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:clamp(14px,1.3vw,22px);font-family:'Comic Sans MS',Fredoka,cursive}

/* ---------- Peti ---------- */
.chest{width:clamp(200px,22vw,340px);display:block;margin:0 auto;overflow:visible}
.chest .lid{transform-origin:50% 92%;transform-box:fill-box;transition:transform 1.1s cubic-bezier(.3,1.6,.5,1)}
.chest.open .lid{transform:rotate(-24deg) translate(-6px,-34px)}
.chest .rays{opacity:0;transform-origin:center;transform-box:fill-box;transition:opacity .8s}
.chest.open .rays{opacity:1;animation:spin 9s linear infinite}
.chest .lock{transition:transform .8s,opacity .8s}
.chest.open .lock{transform:translateY(80px) rotate(40deg);opacity:0}
.chest.shake{animation:shk .45s}
.slots{display:flex;gap:12px;justify-content:center;margin:12px 0}
.slots div{width:clamp(56px,5vw,84px);height:clamp(70px,6.2vw,104px);border-radius:16px;border:4px solid #fff;background:#0b1650;display:grid;place-items:center;font-size:clamp(36px,3.6vw,60px);font-weight:700;color:var(--yl);box-shadow:inset 0 -6px 0 #0006}
.slots div.on{background:#fff;color:var(--ink);animation:pop .3s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.pad button{font-size:clamp(24px,2.2vw,36px);font-weight:700;border:4px solid #fff;border-radius:18px;padding:.25em;background:var(--cy);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--shadow)}
.pad button:active{transform:translateY(3px)}
.pad .x{background:var(--pk);color:#fff}.pad .ok{background:var(--gr)}

/* ---------- Padanan & Sisih ---------- */
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px 34px}
.mt{border:5px solid #fff;border-radius:22px;padding:12px 14px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:84px;box-shadow:0 6px 0 var(--shadow);transition:transform .2s,background .3s;user-select:none;font-size:1.05em}
.mt .em{font-size:clamp(34px,3.2vw,54px)}
.mt:hover{transform:translateY(-3px)}
.mt.sel{outline:7px dashed var(--yl);outline-offset:3px;transform:scale(1.03)}
.mt.done{cursor:default;transform:none}
.mt.bad{animation:shk .4s}
.mt.k0{background:#ffd3e9}.mt.k1{background:#fff3b0}.mt.k2{background:#c9f8e1}.mt.k3{background:#cdf4ff}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:90px;padding:10px;border:4px dashed #fff8;border-radius:24px;margin-bottom:14px}
.bc{background:#fff;color:var(--ink);border:4px solid #fff;border-radius:18px;padding:8px 12px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:grab;box-shadow:0 5px 0 var(--shadow);user-select:none;max-width:290px;font-size:.95em;transition:transform .2s}
.bc .em{font-size:1.7em}
.bc.sel{outline:6px dashed var(--yl);outline-offset:2px;transform:scale(1.04) rotate(-1deg)}
.bc.bad{animation:shk .4s}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bin{border:5px solid #fff;border-radius:28px;padding:12px;min-height:220px;cursor:pointer;transition:transform .2s}
.bin h3{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.bin .lamp{width:46px;height:46px;border-radius:50%;border:4px solid #fff;flex:0 0 auto}
.bin.gn{background:linear-gradient(160deg,#1f9e66,#137a4d)}.bin.gn .lamp{background:#3dff9e;box-shadow:0 0 22px #3dff9e}
.bin.rd{background:linear-gradient(160deg,#c23a4f,#94283a)}.bin.rd .lamp{background:#ff5d6c;box-shadow:0 0 22px #ff5d6c}
.bin.hot{transform:scale(1.02);outline:6px dashed var(--yl)}
.bin .bc{cursor:default;margin:6px 0;max-width:none}

/* ---------- Roda ---------- */
.wheelbox{position:relative;width:clamp(260px,29vw,430px);aspect-ratio:1;margin:0 auto}
.wheelbox svg.w{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.75,.15,1);filter:drop-shadow(0 10px 0 var(--shadow))}
.wheelbox .ptr{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:clamp(40px,4vw,62px);z-index:2;filter:drop-shadow(0 4px 0 var(--shadow))}
.wheelbox .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;background:#fff;border:6px solid var(--ink);display:grid;place-items:center;font-size:clamp(26px,2.6vw,44px);cursor:pointer;z-index:2;box-shadow:0 6px 0 var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:3px solid #fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85em;cursor:pointer;box-shadow:0 4px 0 var(--shadow)}
.chip.done{background:var(--gr)}
.chip.on{background:var(--yl)}
.part{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.part button{border:4px solid #fff;border-radius:18px;padding:6px 14px;font-weight:700;background:#ffffff22;cursor:pointer}
.part button.on{background:var(--yl);color:var(--ink)}
.part button.ok{background:var(--gr);color:var(--ink)}
.gaya{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gy{border:4px solid #fff;border-radius:20px;padding:10px 6px;text-align:center;background:#ffffff1a;cursor:pointer;font-weight:700;font-size:.9em;transition:all .25s}
.gy .em{font-size:clamp(34px,3.2vw,56px);display:block}
.gy.on{background:var(--gr);color:var(--ink);transform:translateY(-4px)}
@media(max-width:700px){.gaya{grid-template-columns:1fr 1fr}}

/* ---------- Meter Suara ---------- */
.vm{display:flex;gap:16px;align-items:stretch}
.vbar{position:relative;flex:1;height:64px;border:5px solid #fff;border-radius:22px;background:linear-gradient(90deg,#ffffff14 0 35%,#5ee8a833 35% 75%,#ffe34d44 75%);overflow:hidden}
.vbar u{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--cy),var(--gr),var(--yl));transition:width .08s}
.vbar .zl{position:absolute;top:0;bottom:0;border-left:3px dashed #fff;opacity:.8}
.vbar .lb{position:absolute;bottom:2px;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000}
.vstar{flex:0 0 auto;width:100px;display:grid;place-items:center;border:5px solid #fff;border-radius:22px;background:#0b1650;font-size:13px;font-weight:700;text-align:center;position:relative;overflow:hidden}
.vstar u{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--yl);transition:height .15s}
.vstar span{position:relative;font-size:38px;line-height:1}
.vstar small{position:relative}
.vstar.full{animation:pop .6s;background:var(--gr)}

/* ---------- Cermin Ajaib ---------- */
.mirror{position:relative;width:clamp(260px,34vw,520px);aspect-ratio:4/3.3;margin:0 auto;border-radius:48% 48% 26px 26px/40% 40% 26px 26px;padding:22px;background:conic-gradient(from 0deg,#ffd84d,#fff3b0,#e8a91c,#ffe680,#d99511,#ffd84d);box-shadow:0 10px 0 var(--shadow),0 0 40px #ffe34d88}
.mirror .glass{position:relative;width:100%;height:100%;border-radius:46% 46% 16px 16px/38% 38% 16px 16px;overflow:hidden;background:radial-gradient(circle at 35% 30%,#ffffff,#bfe9ff 40%,#7fb2ff);display:grid;place-items:center}
.mirror video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.mirror .crown{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:clamp(44px,4.4vw,70px);z-index:3;animation:flt 2.6s ease-in-out infinite}
.mirror .ban{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);background:var(--pk);color:#fff;border:4px solid #fff;border-radius:16px;padding:4px 18px;font-weight:700;white-space:nowrap;z-index:3;font-size:clamp(16px,1.6vw,26px)}
.mirror .sp{position:absolute;font-size:28px;z-index:3;animation:twinkle 1.8s infinite}

/* ---------- Dinding ---------- */
.wall{position:relative;min-height:300px;border:6px solid #c98a4a;border-radius:20px;background:#d9a066 repeating-linear-gradient(45deg,#d39a5f 0 6px,#dba56c 6px 12px);padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start}
.note{width:clamp(130px,12vw,190px);aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:26px 22px 18px;color:var(--ink);font-weight:700;font-size:clamp(13px,1.05vw,17px);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:stick .5s cubic-bezier(.3,1.6,.5,1) both;line-height:1.15}
.note span{display:block;padding-top:20%}
.wall .empty{color:#6b4120;font-weight:700;margin:auto;opacity:.75}

/* ---------- Tindanan ---------- */
#ov{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:#050c33d9;padding:20px}
#ov.on{display:grid}
.cd{font-size:min(36vw,60vh);font-weight:700;color:var(--yl);text-shadow:0 12px 0 var(--pk);animation:cdz .9s both}
.cd.w{font-size:min(12vw,20vh);text-align:center}
.modal{background:var(--paper);color:var(--ink);border:6px solid #fff;border-radius:30px;padding:22px;max-width:1100px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 0 var(--shadow);animation:pop .4s}
.modal h2{text-shadow:none;color:var(--ink)}
.dg{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.dgcard{width:clamp(160px,16vw,240px);aspect-ratio:.78;border-radius:26px;background:linear-gradient(160deg,#fff,#ffeaa0);border:7px solid var(--yl);color:var(--ink);display:grid;place-items:center;font-size:clamp(90px,10vw,160px);font-weight:700;box-shadow:0 0 60px #ffe34daa,0 12px 0 var(--shadow);animation:flipIn 1s cubic-bezier(.3,1.4,.5,1) both}
.cf{position:fixed;top:-30px;z-index:80;pointer-events:none;animation:fall linear forwards}

/* ---------- Jadual guru ---------- */
table.ck{width:100%;border-collapse:collapse;font-size:clamp(13px,1vw,17px)}
table.ck th,table.ck td{border:2px solid #172b7840;padding:6px 8px;text-align:center}
table.ck th{background:#e7ecff}
table.ck td:first-child{text-align:left;font-weight:700}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp button{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:700;cursor:pointer;color:var(--ink)}
.tg{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:2px 8px;cursor:pointer;font-weight:700;color:var(--ink)}
.tg.on{background:var(--gr)}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:.9em;padding:8px 12px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
.set label{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.mat li{margin:4px 0;list-style:none;display:flex;gap:8px;align-items:flex-start}
.mat input{width:22px;height:22px;flex:0 0 auto;margin-top:3px}
.small{font-size:.75em;opacity:.85}
.tip{background:#ffffff1c;border:3px dashed #fff8;border-radius:18px;padding:8px 14px;font-size:.82em}
.paper .tip{background:#172b780d;border-color:#172b7855}
.karaoke span{transition:all .25s;display:inline-block;margin:0 .12em}
.karaoke span.on{color:var(--yl);transform:translateY(-6px) scale(1.12);text-shadow:0 4px 0 var(--pk)}
.karaoke span.blank{min-width:3.4em;border-bottom:5px dashed var(--yl);color:transparent}
.karaoke span.blank.show{color:var(--gr);border-bottom-color:transparent}
.keyc{border:5px solid #fff;border-radius:24px;padding:12px;text-align:center;color:var(--ink);box-shadow:0 7px 0 var(--shadow);animation:pop .5s backwards}
.keyc .em{font-size:clamp(40px,3.8vw,64px)}
.keyc b{display:block;font-size:1.05em}
.keyc small{display:block;font-size:.8em;margin-top:4px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:center}
.hero img{width:100%;border-radius:30px;border:6px solid #fff;box-shadow:0 12px 0 var(--shadow);animation:flt 5s ease-in-out infinite}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient i{position:absolute;bottom:-60px;font-style:normal;opacity:.3;animation:floatUp linear infinite;font-size:clamp(20px,2.4vw,36px)}
.obj{display:grid;gap:10px}
.obj div{display:flex;gap:12px;align-items:center;background:#fff;color:var(--ink);border-radius:18px;padding:8px 14px;font-weight:700;border:4px solid #fff}
.obj div .em{font-size:1.6em}
.obj .K{background:#cdf4ff}.obj .P{background:#c9f8e1}.obj .A{background:#ffd3e9}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tally .tc{background:#fff;color:var(--ink);border-radius:22px;border:5px solid #fff;text-align:center;padding:10px;box-shadow:0 6px 0 var(--shadow)}
.tally .stp{display:flex;justify-content:center;gap:10px;font-weight:700}
.tally .tc .em{font-size:clamp(40px,4vw,70px);display:block;cursor:pointer;transition:transform .2s}
.tally .tc .em:active{transform:scale(1.2)}
.tally .bar{height:110px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0}
.tally .bar u{width:46%;background:linear-gradient(0deg,var(--pk),var(--yl));border-radius:10px 10px 0 0;transition:height .4s;display:block}
.flipc{perspective:900px;cursor:pointer}
.flipc .in{position:relative;transition:transform .7s;transform-style:preserve-3d;min-height:120px}
.flipc.f .in{transform:rotateY(180deg)}
.flipc .fa,.flipc .fb2{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:4px solid #fff;display:grid;place-items:center;padding:10px;text-align:center;font-weight:700}
.flipc .fa{background:#ffffff22}
.flipc .fb2{transform:rotateY(180deg);background:var(--yl);color:var(--ink)}

/* ---------- Mod Kumpulan ---------- */
.gm #path,.gm #timer,.gm #bChk{display:none}
.gm main{padding-bottom:30px}
.gscr .bx{min-height:60px}
button.keyc{width:100%}
button.keyc small{display:block}
.chip.done{background:var(--gr)}
/* ---------- Animasi ---------- */
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
@keyframes bnc{50%{transform:scale(1.18)}}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 var(--shadow),0 0 0 0 #ffe34daa}50%{box-shadow:0 7px 0 var(--shadow),0 0 0 16px #ffe34d00}}
@keyframes shk{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes flt{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
@keyframes msg{0%{transform:scale(.85)}70%{transform:scale(1.04)}100%{transform:none}}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@keyframes cdz{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:.9}}
@keyframes flipIn{0%{transform:rotateY(180deg) scale(.3)}100%{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2) rotate(15deg)}}
@keyframes stick{from{transform:scale(0) rotate(-40deg)}to{transform:rotate(var(--r,0deg))}}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.35}100%{transform:translate(40px,-118vh) rotate(300deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Mod cetak ---------- */
@media print{
  @page{size:A4;margin:9mm}
  body{background:#fff!important;color:#000}
  body::after,#top,#nav,main,#ov,.ambient{display:none!important}
}
.pg{page-break-after:always;break-after:page;color:#172b78;font-family:Fredoka,Arial,sans-serif;width:100%}
.pg:last-child{page-break-after:auto;break-after:auto}
.pg h1{color:#172b78;text-shadow:none;font-size:28px;margin:0 0 4px;filter:none}
.pg h2{text-shadow:none;font-size:20px;margin:4px 0}
.pg .sub{font-size:13px;margin-bottom:8px;color:#444}
.pg .cut{border:2px dashed #888;border-radius:10px}
.pgrid{display:grid;gap:6mm}
.pc{border:3px solid #172b78;border-radius:14px;padding:5mm;text-align:center;position:relative;break-inside:avoid}
.pc .em{font-size:52px;line-height:1.1}
.pc .tx{font-size:20px;font-weight:700}
.pc .sym{position:absolute;right:6px;bottom:4px;font-size:16px;color:#777}
.pmat{display:grid;grid-template-columns:1fr 1fr;gap:6mm;height:250mm}
.pmat > div{border:4px solid;border-radius:18px;padding:5mm;text-align:center}

<script>
"use strict";
/* =====================================================================
   MISI 2: SAYA YAKIN, SAYA BOLEH!  (Pendidikan Kesihatan Tahun 3)
   BBM digital sepenuhnya, berpusatkan bahan.
   Mod Guru (projektor) memandu aliran kelas; Mod Kumpulan (tablet)
   ialah bahan yang dipegang murid: padanan, Pasport Digital, Lampu
   Isyarat, prop digital, Dinding, Lencana. Guru menjadi fasilitator.
   ===================================================================== */
const qrcode=(function(){//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;

let AC=null;
const ac=()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC};
function tone(f,d=.15,type='sine',v=.18,w=0){if(!ST.cfg.snd)return;const a=ac();if(!a)return;const t=a.currentTime+w,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const SFX={
 ok(){[660,880,1320].forEach((f,i)=>tone(f,.22,'triangle',.18,i*.09))},
 no(){tone(220,.25,'square',.08);tone(180,.3,'square',.08,.12)},
 tick(){tone(880,.07,'square',.06)},
 beep(){tone(520,.18,'triangle',.2)},
 go(){tone(784,.12,'triangle',.2);tone(1046,.35,'triangle',.22,.12)},
 fan(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.28,'triangle',.17,i*.12))},
 key(){[1200,1500,1800,2400].forEach((f,i)=>tone(f,.18,'sine',.14,i*.06))},
 unlock(){tone(300,.08,'square',.12);tone(200,.08,'square',.12,.1);[523,784,1046,1568].forEach((f,i)=>tone(f,.5,'triangle',.16,.3+i*.1))},
 pop(){tone(1400,.06,'sine',.1);tone(900,.08,'sine',.08,.04)},
 whoosh(){if(!ST.cfg.snd)return;const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*.4,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=900;g.gain.value=.2;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
};

function say(t,onend){if(!ST.cfg.tts||!('speechSynthesis' in window)){onend&&onend();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[“”"]/g,''));if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='ms-MY';u.rate=.92;u.pitch=1.08;if(onend)u.onend=onend;speechSynthesis.speak(u)}

let TM={left:0,run:false,id:null,ph:-1};
function setPhaseTimer(p){const m=phMin(p)||0;if(TM.ph===p)return;TM.ph=p;TM.left=m*60;TM.run=m>0;drawTimer()}
function drawTimer(){const t=$('#timer'),l=Math.abs(TM.left),s=(TM.left<0?'-':'')+Math.floor(l/60)+':'+String(l%60).padStart(2,'0');t.textContent='⏱ '+s;t.classList.toggle('run',TM.run&&TM.left>=0);t.classList.toggle('late',TM.left<0)}
setInterval(()=>{if(TM.run){TM.left--;if(TM.left===0)SFX.beep();drawTimer()}},1000);
$('#timer').onclick=()=>{TM.run=!TM.run;drawTimer()};

let RT=null;
function ring(sec,id='rg'){return `<div class="ring" id="${id}" data-sec="${sec}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="#ffffff30" stroke-width="10" fill="none"/><circle class="rp" cx="50" cy="50" r="44" stroke="#ffe34d" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="t">${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</div></div>`}
function startRing(id='rg'){const r=document.getElementById(id);if(!r)return;clearInterval(RT);const tot=+r.dataset.sec;let l=tot;r.classList.remove('end');SFX.go();
 const up=()=>{const t=r.querySelector('.t'),c=r.querySelector('.rp');if(!t)return clearInterval(RT);t.textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0');c.style.strokeDashoffset=276.5*(1-l/tot);c.style.stroke=l<=10?'#ff5d6c':'#ffe34d'};
 up();RT=setInterval(()=>{l--;if(l<=5&&l>0)SFX.tick();if(l<=0){clearInterval(RT);l=0;up();r.classList.add('end');SFX.fan()}else up()},1000)}

function go(p,s=0){
 cleanup();ST.p=p;ST.s=s;save();
 if(document.body.classList.contains('gm')){document.body.classList.remove('gm');$('#brand').innerHTML='<b>Misi 2</b><span>Saya Yakin, Saya Boleh!</span>'}
 const app=$('#app');

 setPhaseTimer(p);
 const ph=PH[p],r=ph.steps[s]();
 app.innerHTML=`<div class="screen"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="tag c">${ph.ic} ${ph.ln}</span><span class="small">Cadangan masa: ${phMin(p)?phMin(p)+' minit':'—'}</span></div>${r.h}</div>`;
 $('#nav').classList.remove('hide');
 $('#dots').innerHTML=ph.steps.map((_,i)=>`<i class="${i===s?'on':''}"></i>`).join('');
 $('#navlbl').textContent=`${ph.nm} · ${s+1}/${ph.steps.length}`;
 $('#bBack').disabled=false;
 const last=p===PH.length-1&&s===ph.steps.length-1;
 $('#bNext').classList.toggle('hide',last);
 drawTop();bindSay(app);r.on&&r.on();window.scrollTo(0,0);
}
function next(){const ph=PH[ST.p];if(ST.p<0)return;if(ST.s<ph.steps.length-1)return go(ST.p,ST.s+1);
 if(ph.key!==undefined&&!ST.keys[ph.key])return giveKey(ph.key,()=>go(ST.p+1,0));
 if(ST.p<PH.length-1)go(ST.p+1,0)}
function back(){if(ST.p<0)return;if(ST.s>0)go(ST.p,ST.s-1);else if(ST.p>0)go(ST.p-1,PH[ST.p-1].steps.length-1);else home()}
$('#bNext').onclick=next;$('#bBack').onclick=back;
function home(v='home'){ST.view=v;go(-1)}
$('#brand').onclick=()=>home();
function bindSay(root){root.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.dataset.say)})}

function stSampul1(){return{h:`<h2>🔑 Misi 1: Cari 4 Kunci Keyakinan</h2>${tasks(1,[

function stPadan(){const L=shuf([0,1,2,3]),R=shuf([0,1,2,3]);return{h:`<div class="row" style="justify-content:space-between"><h2>🔍 Semakan Bersama: 4 Kunci</h2><span class="small">Wakil kumpulan: klik gambar ➜ klik perkataan</span></div>

 <div style="display:grid;gap:14px">${R.map(i=>`<div class="mt" data-r="${i}"><span>${KEYS[i].n}</span></div>`).join('')}</div></div>
 <div id="keyrow" class="g4 hide" style="margin-top:16px">${KEYS.map((k,i)=>`<div class="keyc" style="background:${k.col};animation-delay:${i*.15}s"><span class="em">${k.em}</span><b>${k.n}</b><small>${k.d}</small></div>`).join('')}</div>
 <div id="pent" class="hide card" style="margin-top:14px"><h3>💬 Mengapa keyakinan diri penting?</h3><div class="row"><button class="btn sm wh" id="bJ">👀 Jangkaan jawapan</button>
 <span id="jw" class="hide" style="font-weight:700">Supaya kita <u>berani mencuba</u>, <u>tidak takut membuat kesilapan</u> dan <u>lebih mudah belajar</u>.</span></div></div>`,
 on(){let sel=null,done=0;
  $$('#mt [data-l]').forEach(e=>e.onclick=()=>{if(e.classList.contains('done'))return;$$('#mt [data-l]').forEach(x=>x.classList.remove('sel'));sel=e;e.classList.add('sel');SFX.pop()});
  $$('#mt [data-r]').forEach(e=>e.onclick=()=>{if(!sel||e.classList.contains('done'))return;const a=sel.dataset.l,b=e.dataset.r;
   if(a===b){[sel,e].forEach(x=>{x.classList.remove('sel');x.classList.add('done','k'+a)});e.insertAdjacentHTML('afterbegin',`<span class="em">${KEYS[a].sym}</span>`);sel.insertAdjacentHTML('beforeend',`<span class="em" style="margin-left:auto">${KEYS[a].sym}</span>`);SFX.ok();say(KEYS[a].n);sel=null;done++;
    if(done===4){setTimeout(()=>{$('#keyrow').classList.remove('hide');$('#pent').classList.remove('hide');confetti(40);SFX.fan()},500)}}
   else{e.classList.add('bad');sel.classList.add('bad');SFX.no();setTimeout(()=>{e.classList.remove('bad');sel&&sel.classList.remove('bad')},450)}});
  $('#bJ').onclick=()=>{$('#jw').classList.remove('hide');say($('#jw').textContent)}}}}

function stSisih(){const cards=shuf(BEH.map((b,i)=>({...b,i})));return{h:`<div class="row" style="justify-content:space-between"><h2>🔍 Semak Bersama: Yakin atau Belum Yakin?</h2><span class="small">Klik kad ➜ klik lampu (atau seret)</span></div>
 <div class="tray" id="tray">${cards.map(c=>`<div class="bc" draggable="true" data-i="${c.i}"><span class="em">${c.em}</span><span>${esc(c.t)}</span></div>`).join('')}</div>
 <div class="bins"><div class="bin gn" data-y="1"><h3><span class="lamp"></span>YAKIN</h3></div><div class="bin rd" data-y="0"><h3><span class="lamp"></span>BELUM YAKIN</h3></div></div><div id="sfb"></div>`,
 on(){let sel=null,n=0;const place=(c,bin)=>{const b=BEH[+c.dataset.i];if(+bin.dataset.y===b.y){bin.appendChild(c);c.classList.remove('sel');c.draggable=false;c.onclick=null;c.title=b.w;c.insertAdjacentHTML('beforeend',`<span class="small" style="margin-left:auto">${b.y?'✅':'➜ '+esc(b.w)}</span>`);SFX.ok();n++;sel=null;
   if(n===8){$('#sfb').innerHTML='<div class="fb">🎉 Hebat! Semua 8 kad betul. Bandingkan dengan Papan Hasil di tablet kumpulan.</div>';confetti(50);SFX.fan()}}
  else{c.classList.add('bad');SFX.no();say(b.w);setTimeout(()=>c.classList.remove('bad'),450)}};
  $$('#tray .bc').forEach(c=>{c.onclick=()=>{$$('#tray .bc').forEach(x=>x.classList.remove('sel'));sel=c;c.classList.add('sel');SFX.pop()};c.ondragstart=e=>{sel=c;e.dataTransfer.setData('text','x')}});
  $$('.bin').forEach(b=>{b.onclick=()=>sel&&place(sel,b);b.ondragover=e=>{e.preventDefault();b.classList.add('hot')};b.ondragleave=()=>b.classList.remove('hot');b.ondrop=e=>{e.preventDefault();b.classList.remove('hot');sel&&place(sel,b)}})}}}

function stGaya(){return{h:`<div class="c"><span class="tag">✋ PSIKOMOTOR</span><h2>Gaya Wira Yakin 🦸</h2><p>Demonstrasi guru, kemudian semua murid <b>bangun dan tiru</b>. Klik setiap gaya.</p>
 <div class="gaya" id="gy" style="margin:12px 0">${GAYA.map((g,i)=>`<div class="gy" data-i="${i}"><span class="em">${g.em}</span>${g.n}</div>`).join('')}</div>
 <div class="card" style="text-align:left"><h3>🎙️ Meter Suara: sebut “Saya yakin, saya boleh!”</h3>${vmeter('vm1')}<p class="small">Suara mesti sampai <b>zon hijau</b> (jelas), bukan menjerit. Isi bintang untuk lulus.</p></div></div>`,
 on(){$$('#gy .gy').forEach(g=>g.onclick=()=>{g.classList.toggle('on');SFX.pop();say(GAYA[+g.dataset.i].n)});bindVm('vm1')}}}
function wheelSVG(){const cols=CH.map(c=>c.c),R=100;let s='';for(let i=0;i<4;i++){const a0=(i*90-90)*Math.PI/180,a1=((i+1)*90-90)*Math.PI/180;
  const x0=R+R*Math.cos(a0),y0=R+R*Math.sin(a0),x1=R+R*Math.cos(a1),y1=R+R*Math.sin(a1),am=((i+.5)*90-90)*Math.PI/180;
  const done=ST.wheel.includes(i);s+=`<path d="M${R} ${R} L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${done?'#9aa3c7':cols[i]}" stroke="#fff" stroke-width="4"/>`;
  s+=`<g transform="translate(${R+62*Math.cos(am)} ${R+62*Math.sin(am)}) rotate(${(i+.5)*90})"><text text-anchor="middle" y="-6" font-size="26">${done?'✅':CH[i].em}</text><text text-anchor="middle" y="16" font-size="11" font-family="Fredoka,Arial" font-weight="700" fill="#172b78">CABARAN ${i+1}</text></g>`}
 return `<svg class="w" id="wh" viewBox="-4 -4 208 208"><circle cx="100" cy="100" r="102" fill="#fff"/>${s}</svg>`}
let ROT=0;
function stRoda(){const ci=ST.chal;if(ci!==undefined&&ci!==null)return chalScreen(ci);
 const left=[0,1,2,3].filter(i=>!ST.wheel.includes(i));
 return{h:`<div class="g2" style="align-items:center"><div><div class="wheelbox"><div class="ptr">🔻</div>${wheelSVG()}<div class="hub" id="spin" title="Putar">🎡</div></div></div>
 <div><span class="tag">🎡 MISI 3: RODA CABARAN</span><h2>${left.length?'Putar roda untuk memilih cabaran!':'Semua cabaran selesai! 🎉'}</h2>
 <p>Setiap cabaran ada 3 bahagian: <b>🧠 Fikir & Pilih</b> (Kad A/B/C) ➜ <b>✋ Tunjukkan</b> (gunakan prop) ➜ <b>💖 Sebut</b> (Meter Suara).</p>
 <div class="chips" style="justify-content:flex-start;margin:10px 0">${CH.map((c,i)=>`<span class="chip ${ST.wheel.includes(i)?'done':''}" data-ch="${i}">${c.em} ${i+1}. ${c.n}</span>`).join('')}</div>
 ${left.length?`<button class="btn big pk pulse" id="spin2">🎡 PUTAR!</button>`:`<button class="btn big gr pulse" id="fin">🔑 Ambil Kod Ke-3</button>`}
 <p class="small">Guru juga boleh klik terus pada cip cabaran. Kumpulan yang beraksi membuka <b>Misi 3</b> di tablet dan memilih nombor cabaran yang sama (prop digital).</p></div></div>`,
 on(){const spin=()=>{if(!left.length||$('#wh').dataset.busy)return;$('#wh').dataset.busy=1;const pick=left[Math.random()*left.length|0];
   const target=360*5+(360-(pick*90+45));ROT=ROT-(ROT%360)+target;$('#wh').style.transform=`rotate(${ROT}deg)`;
   let k=0;const tk=setInterval(()=>{SFX.tick();if(++k>26)clearInterval(tk)},150);CLEAN.push(()=>clearInterval(tk));
   setTimeout(()=>{SFX.fan();confetti(30);ST.chal=pick;ST.cp=0;save();go(ST.p,ST.s)},4400)};
  $('#spin').onclick=spin;const s2=$('#spin2');if(s2)s2.onclick=spin;
  $$('[data-ch]').forEach(c=>c.onclick=()=>{ST.chal=+c.dataset.ch;ST.cp=0;save();go(ST.p,ST.s)});
  const f=$('#fin');if(f)f.onclick=next;
  $('#wh').style.transition='none';$('#wh').style.transform=`rotate(${ROT}deg)`;requestAnimationFrame(()=>{const w=$('#wh');if(w)w.style.transition=''})}}}
function chalScreen(ci){const c=CH[ci],cp=ST.cp||0,g=ST.cfg.groups,gi=ST.grpTurn%g.length;
 const parts=['🧠 Fikir & Pilih','✋ Tunjukkan','💖 Sebut'];
 let body='';
 if(cp===0)body=`<h3>${esc(c.q)} ${spk(c.s+' '+c.q+' A, '+c.o[0]+'. B, '+c.o[1]+'. C, '+c.o[2])}</h3>${abc(c.o,c.a,c.f,'qc')}`;
 if(cp===1)body=`<div class="g2" style="align-items:center"><div><h3>✋ SEKARANG TUNJUKKAN!</h3><div class="paper"><p><b>Prop:</b> ${c.prop}</p><p>${esc(c.show)}</p></div>
  <p class="small" style="margin-top:10px">Kumpulan <b>${esc(g[gi])}</b> beraksi. Kelas memerhati dan memberi isyarat 👍 apabila nampak Gaya Wira Yakin.</p></div>
  <div><p><b>Senarai semak Gaya Wira Yakin</b> (klik apabila diperhatikan):</p><div class="gaya" id="gyc">${GAYA.map((x,i)=>`<div class="gy ${(chk(gi).g||[])[i]?'on':''}" data-i="${i}"><span class="em">${x.em}</span>${x.n}</div>`).join('')}</div>
  <div class="row cen" style="margin-top:10px">${ring(T(45,30))}<button class="btn gr" id="goRing">▶ ${T(45,30)} saat</button></div></div></div>`;
 if(cp===2)body=`<h3>💖 KESEDIAAN: Sebut bersama-sama dengan suara jelas!</h3><div class="paper c" style="font-size:clamp(26px,3vw,50px);font-weight:700">“${esc(c.say)}”</div>
  <div style="margin-top:14px">${vmeter('vm2')}</div>
  <div class="row" style="margin-top:12px"><label class="row" style="gap:8px"><input type="checkbox" id="vol" ${chk(gi).v?'checked':''} style="width:24px;height:24px"> <b>Afektif:</b> ada murid kumpulan ${esc(g[gi])} menawarkan diri secara sukarela</label></div>`;
 return{h:`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${c.em} Cabaran ${ci+1}: ${esc(c.n)}</h2>
  <label class="small">Kumpulan beraksi: <select id="gsel">${g.map((n,i)=>`<option value="${i}" ${i===gi?'selected':''}>${esc(n)}</option>`).join('')}</select></label></div>
 <div class="tip" style="margin:8px 0 10px;background:${c.c}33">📖 <b>Situasi:</b> ${esc(c.s)}</div>
 <div class="part">${parts.map((p,i)=>`<button data-cp="${i}" class="${i===cp?'on':i<cp?'ok':''}">${i<cp?'✔ ':''}${p}</button>`).join('')}</div>
 <div class="card">${body}</div>
 <div class="row cen">${cp<2?`<button class="btn pk" id="cpn">Seterusnya: ${parts[cp+1]} ▶</button>`:`<button class="btn gr big" id="cdone">✅ Cabaran ${ci+1} Selesai</button>`}<button class="btn sm wh" id="cback">🎡 Kembali ke roda</button></div>`,
 on(){bindAbc();bindRing();
  $('#gsel').onchange=e=>{ST.grpTurn=+e.target.value;save();go(ST.p,ST.s)};
  $$('[data-cp]').forEach(b=>b.onclick=()=>{ST.cp=+b.dataset.cp;save();go(ST.p,ST.s)});
  const n=$('#cpn');if(n)n.onclick=()=>{ST.cp=cp+1;save();go(ST.p,ST.s)};
  $$('#gyc .gy').forEach(x=>x.onclick=()=>{const k=chk(gi);k.g=k.g||[0,0,0,0];k.g[+x.dataset.i]=k.g[+x.dataset.i]?0:1;save();x.classList.toggle('on');SFX.pop()});
  if(cp===2){bindVm('vm2');$('#vol').onchange=e=>{chk(gi).v=e.target.checked?1:0;save()}}

}

GV.m1=()=>{const s=GS.ms;

 if(s===1){const L=shuf([0,1,2,3]),R=shuf([0,1,2,3]);return{h:`${gHead(0,'🔑 Padankan 4 Kunci Keyakinan','Ketik gambar ➜ ketik kunci yang sepadan.')}
  <div class="match" id="mt" style="gap:10px 14px"><div style="display:grid;gap:10px">${L.map(i=>`<div class="mt" data-l="${i}"><span class="em">${KEYS[i].em}</span><span>${KEYS[i].pic}</span></div>`).join('')}</div><div style="display:grid;gap:10px">${R.map(i=>`<div class="mt" data-r="${i}"><span>${KEYS[i].n}</span></div>`).join('')}</div></div>

  return{h:`${gHead(0,'🛂 Pasport Digital',`Ejen ${i+1} daripada ${GS.ej.length}`)}<div class="card c"><div style="font-size:54px">${e.av}</div><h3>Giliran: ${esc(e.n)}</h3>

  <div class="row cen">${w.map(x=>`<button class="btn wh" data-w="${x}">${x}</button>`).join('')}</div><div id="fb"></div></div>`,

    shuf(BEH.map((b,i)=>i)).forEach(i=>{const b=BEH[i],d=document.createElement('div');d.className='bc';d.dataset.i=i;d.innerHTML=`<span class="em">${b.em}</span><span>${esc(b.t)}</span>`;
